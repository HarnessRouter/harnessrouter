# Run every test suite the repository carries, on every pull request and every push to main.
#
# This exists because until now nothing did: `release.yml` gates what ships, but the tests in
# gateway/tests, runner/tests, protocol/conformance/tests and ui only ran when someone remembered
# to run them — which is how a green-looking PR carries a red suite. CONTRIBUTING.md's
# "Development checks" section tells contributors which commands to run; this workflow runs the
# same commands, so the two cannot drift apart without this file changing.
#
# One job per suite, because they fail for unrelated reasons and a contributor should see WHICH
# area broke without reading logs: a gateway failure is not a console failure. No job depends on
# another; they all run in parallel and each is a required signal on its own.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-star-badge.py

  # What a fresh volume installs at first start is pinned: no `releases/latest`, no npm or pip
  # install without an exact version (or a hashed lock), no sums file fetched beside its asset, no
  # curl | sh (#623). The self-test first, so a check that can no longer fail fails here.
  install-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-check-install-pins.py
      - run: python3 scripts/check-install-pins.py
      - run: python3 scripts/test-install-env.py
      # The browser libraries root installs with apt (docker/entrypoint.sh, CHROMIUM_LIBS) are the pinned
      # Playwright's own, read off its source at that tag, for the image's Debian 13 on both architectures.
      # The release gate checks the same against the driver the venv installed, in the container.
      - run: python3 scripts/test-check-chromium-libs.py
      - run: python3 scripts/check-chromium-libs.py --fetch --distro debian13-x64 --distro debian13-arm64

  # deploy/memories/up.sh, the parts that need no Docker: .env at mode 600, which container is
  # HarnessRouter, and that the image never carries a .env from the engines' folder.
  memories-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-memories-deploy.py

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      # The media tests build real fixtures (a one-second mp4, an mp3 with a readable duration)
      # and gate themselves on `have_ffmpeg()` — without ffmpeg they silently skip, and a media
      # regression would ride a green run. Installing it makes them actually run here.
      - name: Install ffmpeg for the media fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # jsonschema is test-only: test_response_error_envelope.py validates failed Responses
      # against the spec schema. It stays out of requirements.txt so it never ships in the image.
      - run: pip install -r gateway/requirements.txt pytest pytest-asyncio jsonschema
      - name: What ships stays under permissive licences
        run: python scripts/check-licenses.py --python
      - run: python -m pytest gateway/tests -q
      # the benchmark suite's rules are pinned by its tests; they read the gateway's vendor tables
      # from source (scripts/support-matrix/samemodel.py) and need nothing the gateway job lacks
      - run: python -m pytest scripts/benchmark -q
      # the memories matrix runner against a memory server and an agent written in its own test
      - run: python -m pytest scripts/support-matrix/memories -q

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements.txt
      # httpx: the runner suite drives the app through FastAPI's TestClient, which needs it. The
      # runner itself does not, so it stays out of requirements.txt and lives with pytest here.
      # The System One Harness is on the runner's venv in the image (docker/entrypoint.sh pins the commit v0.4.0 named);
      # the driver's tests import it, and skip without it, so the suite installs the same pin.
      # CheetahClaws the same way: its driver tests run the pinned package against a stub endpoint
      # (they skip without it), and it resolves beside the runner's own pins (pip check is clean).
      # Qoder's SDK the same way: the qoder driver imports it (the image pins it in its own venv),
      # and the driver's tests run it as a subprocess against a stub Managed API.
      # boto3 (botocore inside): the relay signs Bedrock calls itself, and its tests check every signature
      # against botocore's own for the same request; without it they skip.
      # boto3 at the version the image ships for Hermes (docker/locks/hermes.in): an unpinned install took botocore
      # 1.44.0 the day it came out (2026-11-10), which refuses a bearer token on a plain-http endpoint, and the relay
      # test then failed on a library the image doesn't carry
      - run: pip install -r runner/requirements.txt pytest pytest-asyncio httpx "boto3==1.43.126" "botocore==1.43.126" "systemone-harness @ https://github.com/HarnessRouter/SystemOneHarness/archive/3266a17537e283dc5539439835c0b4cab02bf5c0.tar.gz" "cheetahclaws==3.5.88" "qca-sdk==0.6.0"
      - run: python -m pytest runner/tests -q
      # The tests that hold the runner's work in a session's tree to the session's own identity need root on
      # Linux and skip anywhere else, so the step above skips them. This step runs that file as root, with the
      # job's own python and packages. HR_REQUIRE_ROOT_TESTS=1 makes a run that is not root fail instead of
      # skip, so this step can never quietly go back to skipping; -p no:cacheprovider leaves no root-owned
      # cache in the checkout.
      - run: sudo -E env "PATH=$PATH" HR_REQUIRE_ROOT_TESTS=1 python -m pytest runner/tests/test_root_writes_stay_in_the_session.py -q -rs -p no:cacheprovider

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            runner/requirements.txt
      # Real gateway + HTTP runner + Git, with a synthetic executable at the provider boundary.
      - run: pip install -r gateway/requirements.txt -r runner/requirements.txt pytest pytest-asyncio httpx
      - run: python -m pytest tests/integration -q

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: protocol/conformance/pyproject.toml
      - run: pip install -e protocol/conformance pytest build "setuptools>=68" wheel
      - run: python -m pytest protocol/conformance/tests -q

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Mirrors the Dockerfile's install: .npmrc carries legacy-peer-deps, without which npm
      # refuses the tree (several deps still declare React 18 peers while the app runs 19).
      - name: What ships stays under permissive licences
        run: python3 ../scripts/check-licenses.py --js
      - name: The licence check can fail
        run: python3 ../scripts/test-check-licenses.py
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run type-check
      # The console has no jest tests yet, and bare `jest` exits 1 on "No tests found" — which
      # would read as a test failure when the truth is an empty suite. The flag makes an empty
      # suite pass and a failing test still fail; the first real test file makes it moot.
      - run: npm test -- --passWithNoTests
      - run: npm run build
      - name: The image's list of third-party licences builds
        run: node scripts/third-party-licenses.mjs > /dev/null

  # The unifiedharnessprotocol.org site is generated from protocol/ markdown by
  # protocol/site/build.py and deployed by Vercel. Nothing gated it until now — a broken generator,
  # a dead cross-link, a missing #anchor, or a description-manifest violation would reach the
  # production deploy with a green PR. This job runs the SAME build.sh the Vercel deploy runs, from
  # the same working directory (protocol/), so the gate and the deploy cannot diverge; build.py
  # self-checks links, anchors, versions and metadata, so the build failing is the signal.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read the interpreter from the same .python-version the Vercel build reads, so CI and the
      # deploy can never run different Pythons.
      - uses: actions/setup-python@v5
        with:
          python-version-file: protocol/.python-version
          cache: pip
          cache-dependency-path: protocol/site/requirements.txt
      - name: Build the spec site exactly as the deploy does
        working-directory: protocol
        run: bash site/build.sh
      # The single host config gates the deploy; a malformed vercel.json, or one whose build no
      # longer points at build.sh, would break publishing silently. Assert it stays valid and wired.
      - name: The host config stays valid and wired to build.sh
        run: |
          python3 -c "import json; c=json.load(open('protocol/vercel.json')); assert c['buildCommand']=='bash site/build.sh', 'buildCommand drifted from build.sh'; assert c['outputDirectory']=='site/dist', 'outputDirectory drifted'"
