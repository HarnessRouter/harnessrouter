# Re-measure the reference implementation against the FULL conformance suite, and open a PR that
# replaces the recorded-run block in protocol/conformance/README.md with what was actually measured.
#
# This exists because that block goes stale silently: every new check makes the recorded number one
# the repository can no longer reproduce, and a conformance README whose own headline figure is
# unreproduced is lying about the thing it exists to establish. Regenerating it by hand invites the
# same drift back; regenerating it from a live run, in a PR anyone can inspect before it lands,
# keeps the number honest.
#
# The PR is authored by github-actions[bot], so the record of "who measured this" is the workflow
# itself rather than whoever happened to trigger it. A red run opens no PR: a suite that failed
# must never retire the number it failed to reproduce.
#
# Dispatch inputs name the target; UHP_TARGET_KEY (repository secret) is the API key. The default
# target is the public self-hosted reference instance.
name: conformance-remeasure

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Server root to measure (a live reference deployment)'
        default: 'https://20-98-237-6.sslip.io/api/harness'
      server_label:
        description: 'How the README names what was measured'
        default: 'HarnessRouter Community Edition'

permissions:
  contents: write
  pull-requests: write

jobs:
  remeasure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e protocol/conformance

      # --plain: the transcript goes into a README, and ANSI codes in a code block are noise.
      # The CLI exits 1 on any FAIL/ERROR, which fails this step and stops the PR from opening.
      - name: Run the full suite against the live reference
        env:
          UHP_API_KEY: ${{ secrets.UHP_TARGET_KEY }}
        run: |
          uhp-conformance --base-url '${{ inputs.base_url }}' --class full --plain \
            --json report.json | tee run.txt

      - name: Splice the measured result into the README
        run: |
          python3 - <<'PY'
          import json, re, datetime

          report = json.load(open("report.json"))
          out = open("run.txt").read()
          # The Summary block, verbatim from the tool: the README shows what the tool said,
          # not a paraphrase of it.
          m = re.search(r"( {2}Summary\n(?: {4}.*\n?)+)", out)
          assert m, "no Summary block in the suite output"
          summary = m.group(1).rstrip()

          day = datetime.date.today().isoformat()
          version = report.get("suite_version", "")
          block = f"""<!-- conformance-recorded-run:start — regenerated by .github/workflows/conformance-remeasure.yml; do not edit by hand -->
          ${{ inputs.server_label }}, the reference implementation in this repository, run against a
          live instance on {day} (suite {version}):

          ```
          {summary}
          ```
          <!-- conformance-recorded-run:end -->"""
          # The heredoc indents the template; the README wants it flush left.
          block = "\n".join(ln[10:] if ln.startswith(" " * 10) else ln for ln in block.split("\n"))

          p = "protocol/conformance/README.md"
          s = open(p).read()
          new = re.sub(r"<!-- conformance-recorded-run:start.*?conformance-recorded-run:end -->",
                       block, s, count=1, flags=re.S)
          assert new != s, "the recorded-run markers were not found"
          open(p, "w").write(new)
          PY

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="conformance/remeasure-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add protocol/conformance/README.md
          git commit -m "conformance: retire the stale recorded run for one actually measured

          Measured now, against ${{ inputs.base_url }}, by the conformance-remeasure
          workflow. The transcript in the README is the tool's own output; a run with
          any failure opens no PR at all."
          git push origin "$BRANCH"
          gh pr create --title "conformance: retire the stale recorded run for one actually measured" \
            --body "$(printf 'Automated remeasure of the reference implementation, full class, against `%s`.\n\nThe recorded-run block in `protocol/conformance/README.md` is replaced with the transcript of a run that just happened, so the headline number is one this repository has actually reproduced. Opened by the `conformance-remeasure` workflow; a run with any FAIL or ERROR fails the job and opens nothing.\n\n```\n%s\n```' '${{ inputs.base_url }}' "$(sed -n '/^  Summary/,$p' run.txt)")"
