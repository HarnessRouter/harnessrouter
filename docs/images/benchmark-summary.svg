<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Compare cost and latency across eight configurations</title>
  <desc id="desc">One recorded task. Eight Harness × Model configurations. Save 99.8%, lowest vs. highest cost: 0.47–223 credits. 3.2× faster, fastest vs. slowest run: 1m 25s–4m 36s end to end. These are separate comparisons of the observed extremes. Cost and latency vary by task.</desc>
  <rect x="0.5" y="0.5" width="959" height="249" rx="8" fill="#f6f8ff" stroke="#d7e0ff"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="28" y="34" font-size="17" font-weight="600" fill="#62626c">One recorded task · 8 Harness × Model configurations</text>
    <g fill="none" stroke="#62626c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(29 64)">
        <ellipse cx="9" cy="3" rx="8" ry="3"/>
        <path d="M1 3v12c0 4 16 4 16 0V3M1 9c0 4 16 4 16 0"/>
      </g>
      <g transform="translate(509 64)">
        <circle cx="9" cy="9" r="8.5"/>
        <path d="M9 4v5l4 2"/>
      </g>
    </g>
    <g font-size="18" fill="#62626c">
      <text x="58" y="80" font-weight="600">Cost</text>
      <text x="538" y="80"><tspan font-weight="600">Latency</tspan><tspan> · end to end</tspan></text>
    </g>
    <g font-size="52" font-weight="700" letter-spacing="-1.6" fill="#285aff">
      <text x="28" y="136">Save 99.8%</text>
      <text x="508" y="136">3.2× faster</text>
    </g>
    <g font-size="21" fill="#1f2328">
      <text x="28" y="173"><tspan font-weight="700">0.47–223</tspan><tspan> credits</tspan></text>
      <text x="508" y="173" font-weight="700">1m 25s–4m 36s</text>
    </g>
    <g font-size="15" fill="#62626c">
      <text x="28" y="197">Lowest vs. highest cost</text>
      <text x="508" y="197">Fastest vs. slowest run</text>
      <text x="28" y="229">Cost and latency vary by task.</text>
    </g>
    <text x="932" y="229" text-anchor="end" font-size="17" font-weight="700" fill="#0969da">See the benchmark →</text>
  </g>
</svg>
