<svg xmlns="http://www.w3.org/2000/svg" width="960" height="156" viewBox="0 0 960 156" role="img" aria-labelledby="title">
<title id="title">Cost and latency comparisons across eight configurations on one task</title>
<rect x=".5" y=".5" width="959" height="155" rx="10" fill="#f7f8ff" stroke="#e4e8f6"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(24 0)"><text y="30" font-size="14" fill="#62626c">Cost</text><text y="78" font-size="36" font-weight="700" fill="#285aff">99.8% <tspan font-size="22">lower</tspan></text><text y="116" font-size="16" fill="#62626c">From <tspan font-weight="600" fill="#17171a">223</tspan> to <tspan font-weight="600" fill="#17171a">0.47 credits</tspan></text></g>
<g transform="translate(500 0)"><text y="30" font-size="14" fill="#62626c">End-to-end latency</text><text y="78" font-size="36" font-weight="700" fill="#285aff">3.2× <tspan font-size="22">faster</tspan></text><text y="116" font-size="16" fill="#62626c">From <tspan font-weight="600" fill="#17171a">4m 36s</tspan> to <tspan font-weight="600" fill="#17171a">1m 25s</tspan></text></g>
</g></svg>
