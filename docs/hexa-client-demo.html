<title>Hexa 多 Agent 工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens ============ */
:root{
  color-scheme: light;
  --hx-bg:#f5f5f7;
  --hx-surface:#ffffff;
  --hx-surface-muted:#f1f1f4;
  --hx-ink:#1d1d1f;
  --hx-ink-muted:#6e6e73;
  --hx-line:#e2e2e7;
  --hx-primary:#0a84ff;
  --hx-primary-soft:#eaf3ff;
  --hx-success:#248a52;
  --hx-warning:#9b6817;
  --hx-danger:#c23b3b;
  --hx-hover:#f4f4f7;
  --hx-code-bg:#f6f6f8;
  --hx-edge:#c7c7d0;
  --hx-rail:#0e1626;
  --hx-rail-ink:#a6b0c2;
  --hx-rail-active:#1b2942;
  --hx-overlay:rgba(17,20,27,.42);
  --hx-shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.05);
  --hx-tone-blue:#0a66d6;   --hx-tone-blue-bg:#e8f1ff;
  --hx-tone-teal:#0f766e;   --hx-tone-teal-bg:#e3f5f2;
  --hx-tone-amber:#9b6817;  --hx-tone-amber-bg:#fbf1df;
  --hx-tone-slate:#495264;  --hx-tone-slate-bg:#eceef3;
  --r-card:12px;
  --r-ctrl:8px;
  --rail:56px;
  --sub:236px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --hx-bg:#0c0c0f;
    --hx-surface:#16161a;
    --hx-surface-muted:#1f1f25;
    --hx-ink:#f3f3f5;
    --hx-ink-muted:#9c9ca5;
    --hx-line:#2a2a32;
    --hx-primary:#4c9dff;
    --hx-primary-soft:rgba(10,132,255,.16);
    --hx-success:#58c98a;
    --hx-warning:#e0a851;
    --hx-danger:#f07373;
    --hx-hover:#1d1d23;
    --hx-code-bg:#101014;
    --hx-edge:#3b3b46;
    --hx-rail:#070b13;
    --hx-rail-ink:#93a0b5;
    --hx-rail-active:#182339;
    --hx-overlay:rgba(0,0,0,.56);
    --hx-shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
    --hx-tone-blue:#7cb8ff;   --hx-tone-blue-bg:rgba(76,157,255,.16);
    --hx-tone-teal:#5ed3c8;   --hx-tone-teal-bg:rgba(94,211,200,.14);
    --hx-tone-amber:#e5b564;  --hx-tone-amber-bg:rgba(224,168,81,.15);
    --hx-tone-slate:#b6bdcc;  --hx-tone-slate-bg:rgba(182,189,204,.13);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --hx-bg:#0c0c0f;
  --hx-surface:#16161a;
  --hx-surface-muted:#1f1f25;
  --hx-ink:#f3f3f5;
  --hx-ink-muted:#9c9ca5;
  --hx-line:#2a2a32;
  --hx-primary:#4c9dff;
  --hx-primary-soft:rgba(10,132,255,.16);
  --hx-success:#58c98a;
  --hx-warning:#e0a851;
  --hx-danger:#f07373;
  --hx-hover:#1d1d23;
  --hx-code-bg:#101014;
  --hx-edge:#3b3b46;
  --hx-rail:#070b13;
  --hx-rail-ink:#93a0b5;
  --hx-rail-active:#182339;
  --hx-overlay:rgba(0,0,0,.56);
  --hx-shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
  --hx-tone-blue:#7cb8ff;   --hx-tone-blue-bg:rgba(76,157,255,.16);
  --hx-tone-teal:#5ed3c8;   --hx-tone-teal-bg:rgba(94,211,200,.14);
  --hx-tone-amber:#e5b564;  --hx-tone-amber-bg:rgba(224,168,81,.15);
  --hx-tone-slate:#b6bdcc;  --hx-tone-slate-bg:rgba(182,189,204,.13);
}

/* ============ Base ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--hx-bg);
  color:var(--hx-ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13.5px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:not-allowed;opacity:.42}
input,textarea,select{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
svg.ic{display:block;flex:none}
:focus-visible{outline:2px solid var(--hx-primary);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--hx-line) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--hx-line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.icon-btn.mobile-only{display:none}
.tm{font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tm,.muted-count,.tr-sub,.tr-tpl .tm{color:var(--hx-ink-muted);font-size:11.5px}
.muted-count{font-weight:400;font-size:11.5px}

/* ============ App frame ============ */
.frame{
  height:100%;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{
  position:relative;
  height:100%;
  display:grid;
  grid-template-columns:var(--rail) var(--sub) minmax(0,1fr) auto;
  background:var(--hx-surface);
  border:1px solid var(--hx-line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 24px 60px rgba(15,23,42,.10);
}
#rail,#subnav,#main,#inspector{min-height:0}

/* ============ Rail ============ */
#rail{
  background:var(--hx-rail);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:12px 0 14px;
  position:relative;
  z-index:80;
}
.rail-top{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(155deg,#3b8dff,#0a5ad6);
  color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(10,90,214,.35);
}
.ws-btn{
  width:32px;height:32px;border-radius:9px;
  background:var(--hx-rail-active);color:#dce5f5;
  border:1px solid rgba(255,255,255,.09);
  display:grid;place-items:center;font-weight:600;font-size:12.5px;
  position:relative;
}
.ws-btn:hover{background:#22324f}
.ws-btn::after{
  content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;
  border-radius:50%;background:#34c759;border:1.5px solid var(--hx-rail);
}
.rail-nav{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;margin-top:10px}
.rail-btn{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--hx-rail-ink);position:relative;
}
.rail-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.rail-btn.active{background:var(--hx-rail-active);color:#fff}
.rail-btn.active::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;
  border-radius:2px;background:#4c9dff;
}
.rail-spacer{flex:1}
.rail-bottom{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.user-avatar{
  width:30px;height:30px;border-radius:50%;background:#2b3a55;color:#e8eefb;
  display:grid;place-items:center;font-size:12px;font-weight:600;position:relative;
  border:1px solid rgba(255,255,255,.1);margin-top:4px;
}
.user-avatar::after{
  content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;
  background:#34c759;border:1.5px solid var(--hx-rail);
}
.ws-pop{
  position:absolute;left:52px;top:58px;width:268px;z-index:250;
  background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);padding:8px;color:var(--hx-ink);
}
.ws-pop-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--hx-ink-muted);padding:7px 9px 5px}
.ws-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:7px;font-size:12.5px}
.ws-item:hover{background:var(--hx-hover)}
.ws-item .ws-ic{width:24px;height:24px;border-radius:6px;background:var(--hx-surface-muted);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--hx-ink-muted)}
.ws-item .check{margin-left:auto;color:var(--hx-primary)}
.ws-sep{height:1px;background:var(--hx-line);margin:6px 4px}
.ws-action{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:7px;font-size:12.5px;color:var(--hx-ink-muted)}
.ws-action:hover{background:var(--hx-hover);color:var(--hx-ink)}
.ws-note{padding:7px 9px 5px;font-size:10.2px;line-height:1.5;color:var(--hx-ink-muted);border-top:1px solid var(--hx-line);margin-top:5px}

/* ============ Sub navigation ============ */
#subnav{
  background:var(--hx-surface);
  border-right:1px solid var(--hx-line);
  display:flex;flex-direction:column;min-width:0;
}
.sub-head{
  height:56px;flex:none;display:flex;align-items:center;gap:6px;
  padding:0 10px 0 16px;border-bottom:1px solid var(--hx-line);
}
.sub-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sub-head .count{font-size:11px;color:var(--hx-ink-muted);background:var(--hx-surface-muted);border-radius:20px;padding:1px 7px;font-weight:500}
.sub-head-actions{margin-left:auto;display:flex;gap:1px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--hx-ink-muted);flex:none}
.icon-btn:hover{background:var(--hx-hover);color:var(--hx-ink)}
.icon-btn.on{background:var(--hx-primary-soft);color:var(--hx-primary)}
.sub-search{padding:8px 12px 2px}
.sub-search input{
  width:100%;height:32px;border:1px solid var(--hx-line);border-radius:8px;
  background:var(--hx-surface-muted);padding:0 10px;font-size:12.5px;outline:none;
}
.sub-search input:focus{border-color:var(--hx-primary);background:var(--hx-surface);box-shadow:0 0 0 3px var(--hx-primary-soft)}
.new-btn{
  margin:8px 12px 6px;height:34px;border:1px dashed var(--hx-line);border-radius:8px;
  display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--hx-ink-muted);
  font-size:12.5px;flex:none;
}
.new-btn:hover{border-color:var(--hx-primary);color:var(--hx-primary);background:var(--hx-primary-soft)}
.sub-scroll{flex:1;overflow:auto;padding:2px 0 14px;min-height:0}
.list-label{
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--hx-ink-muted);padding:14px 17px 6px;display:flex;align-items:center;gap:6px;
}
.conv-item{
  width:calc(100% - 16px);margin:1px 8px;padding:8px 10px;border-radius:8px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;
}
.conv-item:hover{background:var(--hx-hover)}
.conv-item.active{background:var(--hx-primary-soft)}
.conv-item .t{font-size:12.8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item.active .t{color:var(--hx-primary)}
.conv-item .tm{font-size:10.5px;padding-top:1px}
.conv-item .m{grid-column:1/-1;font-size:11px;color:var(--hx-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-row{
  display:flex;align-items:center;gap:9px;width:calc(100% - 16px);margin:1px 8px;
  padding:8px 10px;border-radius:8px;font-size:12.8px;
}
.nav-row:hover{background:var(--hx-hover)}
.nav-row.active{background:var(--hx-primary-soft);color:var(--hx-primary)}
.nav-row .dot{width:6px;height:6px;border-radius:50%;flex:none}
.nav-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.nav-row .tm{flex:none;font-size:10.5px}
.nav-row .count{margin-left:auto;font-size:10.5px;color:var(--hx-ink-muted)}
.empty-hint{padding:18px 16px;font-size:12px;color:var(--hx-ink-muted);line-height:1.6}

/* ============ Main ============ */
#main{background:var(--hx-bg);display:flex;flex-direction:column;min-width:0;position:relative}
.main-head{
  height:56px;flex:none;display:flex;align-items:center;gap:8px;
  padding:0 12px 0 16px;background:var(--hx-surface);border-bottom:1px solid var(--hx-line);
}
.head-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mh-title{
  font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.head-actions{display:flex;align-items:center;gap:6px;flex:none}
.head-actions.wrap{flex-wrap:nowrap;overflow-x:auto;padding:4px 0;scrollbar-width:none;flex:0 1 auto;min-width:0}
.head-actions.wrap::-webkit-scrollbar{display:none}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;
  border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;flex:none;
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill.gray{background:var(--hx-surface-muted);color:var(--hx-ink-muted)}
.pill.blue{background:var(--hx-primary-soft);color:var(--hx-primary)}
.pill.green{background:color-mix(in srgb,var(--hx-success) 13%,transparent);color:var(--hx-success)}
.pill.amber{background:color-mix(in srgb,var(--hx-warning) 14%,transparent);color:var(--hx-warning)}
.pill.red{background:color-mix(in srgb,var(--hx-danger) 13%,transparent);color:var(--hx-danger)}
.tpl-chip{
  display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;
  background:var(--hx-surface-muted);color:var(--hx-ink-muted);font-size:10.5px;white-space:nowrap;
}
.btn{
  height:32px;padding:0 11px;border-radius:8px;border:1px solid transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:12.3px;font-weight:500;white-space:nowrap;
}
.btn.primary{background:var(--hx-primary);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--hx-surface);border-color:var(--hx-line);color:var(--hx-ink)}
.btn.secondary:hover{background:var(--hx-hover)}
.btn.ghost{color:var(--hx-ink-muted)}
.btn.ghost:hover{background:var(--hx-surface-muted);color:var(--hx-ink)}
.btn.danger{color:var(--hx-danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--hx-danger) 10%,transparent)}
.btn.sm{height:28px;padding:0 9px;font-size:11.8px}

/* ============ Chat ============ */
.chat-body{flex:1;overflow:auto;min-height:0;padding:20px 24px 6px}
.chat-inner{max-width:820px;margin:0 auto}
.msg{display:flex;gap:11px;margin-bottom:22px}
.msg.user{justify-content:flex-end}
.bubble{
  max-width:76%;background:var(--hx-surface);border:1px solid var(--hx-line);
  border-radius:12px 12px 4px 12px;padding:9px 13px;line-height:1.65;
  box-shadow:var(--hx-shadow);font-size:13.5px;
}
.msg.user .msg-time{display:block;text-align:right;margin-top:4px;font-size:10.5px;color:var(--hx-ink-muted)}
.avatar{
  border-radius:8px;display:inline-grid;place-items:center;font-weight:600;flex:none;
  width:28px;height:28px;font-size:11.5px;
}
.t-blue{background:var(--hx-tone-blue-bg);color:var(--hx-tone-blue)}
.t-teal{background:var(--hx-tone-teal-bg);color:var(--hx-tone-teal)}
.t-amber{background:var(--hx-tone-amber-bg);color:var(--hx-tone-amber)}
.t-slate{background:var(--hx-tone-slate-bg);color:var(--hx-tone-slate)}
.msg-main{min-width:0;flex:1}
.msg-meta{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.msg-meta strong{font-size:12.8px;font-weight:600}
.model-chip{
  font-size:10.5px;color:var(--hx-ink-muted);background:var(--hx-surface-muted);
  border-radius:5px;padding:1px 6px;
}
.msg-state{font-size:10.5px;color:var(--hx-success);display:inline-flex;align-items:center;gap:4px}
.msg-state::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.msg-card{
  background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:10px;
  padding:12px 14px;line-height:1.7;box-shadow:var(--hx-shadow);font-size:13.4px;
}
.msg-card p + p{margin-top:8px}
.msg-card strong{font-weight:600}
.msg.summary .msg-card{
  background:var(--hx-primary-soft);border-color:color-mix(in srgb,var(--hx-primary) 22%,var(--hx-line));
}
.summary-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--hx-primary);margin-bottom:6px;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border-radius:6px;
  background:var(--hx-surface-muted);color:var(--hx-ink-muted);font-size:11px;
}
.chip svg{opacity:.75}
.file-card{
  display:flex;align-items:center;gap:9px;margin-top:8px;padding:8px 10px;
  border:1px solid var(--hx-line);border-radius:8px;background:var(--hx-surface);max-width:330px;
}
.file-ic{width:28px;height:28px;border-radius:6px;background:var(--hx-primary-soft);color:var(--hx-primary);display:grid;place-items:center;flex:none}
.file-card .fc-name{font-size:12px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-card .fc-meta{font-size:10.5px;color:var(--hx-ink-muted)}
.workflow-card{
  margin-top:10px;border:1px solid var(--hx-line);border-radius:9px;background:var(--hx-surface);
  padding:10px 12px;display:flex;align-items:center;gap:10px;
}
.workflow-card .wf-ic{width:30px;height:30px;border-radius:7px;background:var(--hx-primary-soft);color:var(--hx-primary);display:grid;place-items:center;flex:none}
.workflow-card .wf-t{font-size:12.3px;font-weight:600}
.workflow-card .wf-m{font-size:10.5px;color:var(--hx-ink-muted);margin-top:1px}
.workflow-card .wf-actions{margin-left:auto;display:flex;gap:4px;flex:none}
.typing{display:flex;align-items:center;gap:9px;color:var(--hx-ink-muted);font-size:12px;margin-bottom:20px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-empty{max-width:520px;margin:10vh auto 0;text-align:center}
.chat-empty h2{font-size:20px;letter-spacing:-.02em;margin-bottom:8px}
.chat-empty p{color:var(--hx-ink-muted);font-size:13px;line-height:1.7;margin-bottom:18px}
.suggest-list{display:flex;flex-direction:column;gap:8px;text-align:left}
.suggest{
  border:1px solid var(--hx-line);background:var(--hx-surface);border-radius:9px;
  padding:10px 12px;font-size:12.5px;color:var(--hx-ink);box-shadow:var(--hx-shadow);
}
.suggest:hover{border-color:var(--hx-primary);color:var(--hx-primary)}
.composer-wrap{padding:8px 24px 16px;flex:none}
.composer{
  max-width:820px;margin:0 auto;background:var(--hx-surface);border:1px solid var(--hx-line);
  border-radius:14px;padding:10px 12px 8px;box-shadow:var(--hx-shadow);
}
.composer:focus-within{border-color:color-mix(in srgb,var(--hx-primary) 55%,var(--hx-line))}
.composer textarea{
  width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--hx-ink);
  font-family:inherit;font-size:13.5px;line-height:1.5;min-height:24px;max-height:150px;
  padding:2px 2px 6px;display:block;
}
.composer textarea::placeholder{color:var(--hx-ink-muted)}
.composer-bar{display:flex;align-items:center;gap:2px}
.composer-tools{display:flex;gap:1px}
.composer-hint{margin-left:auto;margin-right:8px;font-size:10.5px;color:var(--hx-ink-muted);white-space:nowrap}
.send-btn{
  width:30px;height:30px;border-radius:8px;background:var(--hx-primary);color:#fff;
  display:grid;place-items:center;flex:none;
}
.send-btn.dim{opacity:.42}
.send-btn.stop{background:var(--hx-danger)}
.ctx-chip{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:6px;
  border:1px solid var(--hx-line);font-size:10.5px;color:var(--hx-ink-muted);margin-left:4px;
}

/* ============ Tasks ============ */
.page-scroll{flex:1;overflow:auto;padding:20px 24px 28px;min-height:0}
.page-head{max-width:1100px;margin:0 auto 14px}
.page-head h2{font-size:17px;letter-spacing:-.015em;margin-bottom:3px}
.page-head p{font-size:12px;color:var(--hx-ink-muted)}
.table-card{max-width:1100px;margin:0 auto;background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:12px;overflow:hidden}
.table-head,.task-row{
  display:grid;grid-template-columns:minmax(220px,1.7fr) 172px 104px 138px 108px 18px;
  gap:14px;align-items:center;padding:0 18px;
}
.table-head{
  height:38px;background:var(--hx-surface-muted);font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--hx-ink-muted);
}
.task-row{width:100%;min-height:66px;border-top:1px solid var(--hx-line);padding-block:10px}
.task-row:hover{background:var(--hx-hover)}
.tr-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.tr-name strong{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-sub{font-size:10.8px;color:var(--hx-ink-muted)}
.tr-tpl{display:flex;align-items:center;gap:6px;min-width:0}
.tr-tpl .tpl-chip{max-width:126px;overflow:hidden;text-overflow:ellipsis}
.tr-prog{display:flex;align-items:center;gap:8px}
.prog{display:block;height:5px;border-radius:4px;background:var(--hx-surface-muted);overflow:hidden;flex:1;min-width:40px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--hx-primary);transition:width .4s ease}
.prog.done i{background:var(--hx-success)}
.prog.fail i{background:var(--hx-danger)}
.prog.stopped i{background:var(--hx-warning)}
.chev{color:var(--hx-ink-muted);justify-self:end}
.detail-head{padding-left:8px}
.run-area{flex:1;overflow:auto;padding:18px 20px 22px;min-height:0}
.run-stage-wrap{max-width:1120px;margin:0 auto;background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:12px;overflow:hidden}
.canvas-toolbar{
  height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;
  border-bottom:1px solid var(--hx-line);font-size:12px;color:var(--hx-ink-muted);flex-wrap:wrap;
}
.canvas-toolbar .toolbar-title{font-weight:500;color:var(--hx-ink)}
.legend{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;font-size:10.8px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:7px;height:7px;border-radius:50%;flex:none}
.canvas-scroll{
  position:relative;overflow:auto;padding:20px;
  background-image:radial-gradient(color-mix(in srgb,var(--hx-ink-muted) 26%,transparent) 1px,transparent 1px);
  background-size:18px 18px;
}
.canvas-stage{position:relative;margin:0 auto}
.canvas-world{position:relative;width:980px;height:540px;transform-origin:top left;transform:scale(1)}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edge{stroke:var(--hx-edge);stroke-width:1.6;fill:none}
.flow-node{
  position:absolute;width:190px;background:var(--hx-surface);border:1px solid var(--hx-line);
  border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(16,24,40,.06);
  transition:box-shadow .15s ease,border-color .15s ease;
}
.flow-node .fn-name{display:flex;align-items:center;gap:7px;font-size:12.6px;font-weight:600}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--hx-ink-muted);flex:none}
.flow-node .fn-meta{font-size:10.8px;color:var(--hx-ink-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-node .fn-foot{display:flex;gap:9px;margin-top:8px;font-size:10.2px;color:var(--hx-ink-muted);font-variant-numeric:tabular-nums;align-items:center}
.flow-node .fn-foot .blocked{color:var(--hx-warning);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-node .type-badge{
  margin-left:auto;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--hx-ink-muted);background:var(--hx-surface-muted);border-radius:4px;padding:1px 5px;
}
.flow-node.status-done{border-color:color-mix(in srgb,var(--hx-success) 38%,var(--hx-line))}
.flow-node.status-done .status-dot{background:var(--hx-success)}
.flow-node.status-running{border-color:var(--hx-primary)}
.flow-node.status-running .status-dot{background:var(--hx-primary);animation:pulse 1.5s infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hx-primary) 40%,transparent)}
  55%{box-shadow:0 0 0 5px transparent}
}
.flow-node.status-failed{border-color:var(--hx-danger)}
.flow-node.status-failed .status-dot{background:var(--hx-danger)}
.flow-node.status-blocked{border-style:dashed}
.flow-node.status-blocked .status-dot{background:var(--hx-warning)}
.flow-node.selected{outline:2px solid var(--hx-primary);outline-offset:2px}
.canvas-world.editable .flow-node{cursor:grab;touch-action:none}
.canvas-world.editable .flow-node:active{cursor:grabbing}

/* ============ Template editor ============ */
.editor-body{flex:1;display:grid;grid-template-columns:258px minmax(0,1fr);min-height:0}
.org-panel{
  background:var(--hx-surface);border-right:1px solid var(--hx-line);
  padding:14px 12px;overflow:auto;display:flex;flex-direction:column;gap:5px;min-height:0;
}
.org-head{padding:0 4px 8px}
.org-head strong{font-size:12.5px;font-weight:600;display:block;margin-bottom:3px}
.org-head p{font-size:11px;color:var(--hx-ink-muted);line-height:1.55}
.org-quick{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.org-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:8px;
  border:1px solid var(--hx-line);background:var(--hx-surface);font-size:12px;color:var(--hx-ink);
}
.org-btn:hover{border-color:var(--hx-primary);color:var(--hx-primary);background:var(--hx-primary-soft)}
.org-btn svg{color:var(--hx-ink-muted)}
.org-btn:hover svg{color:var(--hx-primary)}
.org-label{
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--hx-ink-muted);padding:8px 5px 4px;
}
.org-list{display:flex;flex-direction:column;gap:2px}
.org-node{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
  font-size:12px;width:100%;
}
.org-node:hover{background:var(--hx-hover)}
.org-node.active{background:var(--hx-primary-soft);color:var(--hx-primary)}
.org-node .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.org-node .a{font-size:10px;color:var(--hx-ink-muted);flex:none}
.canvas-area{display:flex;flex-direction:column;min-width:0;background:var(--hx-bg)}
.zoom-controls{display:flex;align-items:center;gap:2px;margin-left:auto}
.zoom-controls button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--hx-ink-muted)}
.zoom-controls button:hover{background:var(--hx-surface-muted);color:var(--hx-ink)}
.zoom-controls span{font-size:11px;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.editor-hint{max-width:340px;font-size:11px;color:var(--hx-ink-muted)}

/* ---- AI orchestration ---- */
.org-tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--hx-surface-muted);border-radius:9px;padding:3px;margin-bottom:4px;flex:none}
.org-tab{
  display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border-radius:7px;
  font-size:11.5px;font-weight:500;color:var(--hx-ink-muted);
}
.org-tab:hover{color:var(--hx-ink)}
.org-tab.active{background:var(--hx-surface);color:var(--hx-ink);box-shadow:0 1px 2px rgba(16,24,40,.09)}
.org-tab svg{flex:none}
.ai-panel{flex:1;display:flex;flex-direction:column;min-height:0;gap:7px;padding-top:2px}
.ai-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px 2px 4px;min-height:60px}
.ai-msg{display:flex;gap:7px;font-size:11.8px;line-height:1.6;align-items:flex-start}
.ai-msg .who{
  width:20px;height:20px;border-radius:6px;background:var(--hx-primary-soft);color:var(--hx-primary);
  display:grid;place-items:center;flex:none;font-size:8.5px;font-weight:700;letter-spacing:.02em;margin-top:1px;
}
.ai-bubble{padding:8px 10px;border-radius:10px;background:var(--hx-surface-muted);max-width:100%;min-width:0;word-break:break-word}
.ai-msg.user{justify-content:flex-end}
.ai-msg.user .ai-bubble{background:var(--hx-primary-soft);color:var(--hx-ink)}
.ai-flow{border:1px solid var(--hx-line);border-radius:9px;padding:8px 9px;margin-top:7px;display:flex;flex-direction:column;gap:5px;background:var(--hx-surface)}
.ai-flow-title{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--hx-ink);margin-bottom:1px}
.ai-flow-title svg{color:var(--hx-primary)}
.ai-flow-title .n{margin-left:auto;font-weight:500;color:var(--hx-ink-muted);font-size:9.5px}
.ai-flow-row{display:flex;align-items:center;gap:5px;font-size:10.3px;color:var(--hx-ink-muted);min-width:0}
.ai-flow-row .idx{width:15px;height:15px;border-radius:4px;background:var(--hx-surface-muted);display:grid;place-items:center;font-size:8.5px;color:var(--hx-ink-muted);flex:none}
.ai-flow-row b{font-size:10.8px;color:var(--hx-ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-flow-row .agent{flex:none}
.ai-flow-row .deps{margin-left:auto;flex:none;font-size:9.5px}
.ai-suggest{display:flex;flex-wrap:wrap;gap:5px;flex:none}
.ai-suggest button{
  font-size:10.3px;padding:5px 8px;border:1px solid var(--hx-line);border-radius:999px;
  color:var(--hx-ink-muted);background:var(--hx-surface);line-height:1.35;text-align:left;
}
.ai-suggest button:hover{border-color:var(--hx-primary);color:var(--hx-primary);background:var(--hx-primary-soft)}
.ai-compose{border:1px solid var(--hx-line);border-radius:10px;padding:7px;background:var(--hx-surface);display:flex;flex-direction:column;gap:6px;flex:none}
.ai-compose:focus-within{border-color:var(--hx-primary)}
.ai-compose textarea{
  width:100%;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:12px;
  line-height:1.55;min-height:48px;max-height:110px;color:var(--hx-ink);padding:1px 2px;
}
.ai-compose textarea::placeholder{color:var(--hx-ink-muted)}
.ai-compose-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ai-compose-foot .hint{font-size:9.3px;color:var(--hx-ink-muted);line-height:1.4}
.ai-compose-foot .btn{flex:none}
.ai-typing{display:inline-flex;gap:4px;align-items:center;padding:3px 1px}
.ai-typing i{width:5px;height:5px;border-radius:50%;background:var(--hx-ink-muted);animation:aiBlink 1.1s infinite}
.ai-typing i:nth-child(2){animation-delay:.16s}
.ai-typing i:nth-child(3){animation-delay:.32s}
@keyframes aiBlink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-1px)}}
.ai-banner{
  display:flex;align-items:center;gap:9px;padding:8px 12px;flex:none;
  background:var(--hx-primary-soft);border-bottom:1px solid color-mix(in srgb,var(--hx-primary) 22%,var(--hx-line));
  font-size:11.5px;
}
.ai-banner .dot{width:7px;height:7px;border-radius:50%;background:var(--hx-primary);flex:none;animation:pulse 1.6s infinite}
.ai-banner .ai-banner-txt{min-width:0;display:flex;flex-direction:column;line-height:1.45}
.ai-banner .ai-banner-txt strong{font-size:11.5px;font-weight:600}
.ai-banner .ai-banner-txt span{font-size:10px;color:var(--hx-ink-muted)}
.ai-banner .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.ai-banner .btn.sm{padding:5px 9px;font-size:11px}
.ai-spin{
  width:13px;height:13px;border-radius:50%;flex:none;
  border:2px solid color-mix(in srgb,var(--hx-primary) 25%,transparent);
  border-top-color:var(--hx-primary);animation:aiSpin .8s linear infinite;
}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.flow-node.ai-preview{
  border-style:dashed;
  border-color:color-mix(in srgb,var(--hx-primary) 48%,var(--hx-line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--hx-primary) 7%,transparent);
  cursor:default;
}
.canvas-world.editable .flow-node.ai-preview{cursor:default}
.canvas-world.editable .flow-node.ai-preview:active{cursor:default}
.toolbar-title .ai-tag{
  display:inline-flex;align-items:center;gap:4px;margin-left:7px;padding:2px 6px;border-radius:999px;
  background:var(--hx-primary-soft);color:var(--hx-primary);font-size:9.5px;font-weight:600;letter-spacing:.02em;
  vertical-align:1px;
}

/* ============ Agents ============ */
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:14px;max-width:1120px;margin:0 auto}
.agent-card{
  background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:12px;
}
.agent-card:hover{border-color:color-mix(in srgb,var(--hx-primary) 35%,var(--hx-line))}
.agent-top{display:flex;align-items:flex-start;gap:11px}
.agent-top .avatar{width:38px;height:38px;font-size:14px;border-radius:10px}
.agent-id{min-width:0;flex:1}
.agent-id h3{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.agent-id .avail{font-size:10.5px;color:var(--hx-success);display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.agent-id .avail::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.star{color:var(--hx-ink-muted);width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.star:hover{background:var(--hx-surface-muted)}
.star.on{color:var(--hx-warning)}
.agent-desc{font-size:12.2px;line-height:1.65;color:var(--hx-ink-muted);min-height:40px}
.agent-meta{display:flex;flex-wrap:wrap;gap:5px}
.agent-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--hx-line)}
.agent-foot .last{font-size:10.5px;color:var(--hx-ink-muted);margin-right:auto}

/* ============ Inspector ============ */
#inspector{
  width:320px;background:var(--hx-surface);border-left:1px solid var(--hx-line);
  display:flex;flex-direction:column;min-height:0;
}
#inspector.none{display:none}
.insp-head{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--hx-line)}
.insp-head strong{font-size:13px;font-weight:600}
.insp-head .tm{margin-left:auto;font-size:10.5px}
.insp-tabs{display:flex;gap:2px;padding:7px 8px;border-bottom:1px solid var(--hx-line);flex:none;overflow-x:auto;scrollbar-width:none}
.insp-tabs::-webkit-scrollbar{display:none}
.insp-tab{height:28px;padding:0 10px;border-radius:6px;font-size:11.8px;color:var(--hx-ink-muted);white-space:nowrap}
.insp-tab:hover{background:var(--hx-hover);color:var(--hx-ink)}
.insp-tab.active{background:var(--hx-surface-muted);color:var(--hx-ink);font-weight:500}
.insp-body{flex:1;overflow:auto;padding:14px 15px 24px;min-height:0}
.insp-section{margin-bottom:20px}
.insp-label{
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--hx-ink-muted);margin-bottom:8px;
}
.kv{display:flex;flex-direction:column;gap:0;border:1px solid var(--hx-line);border-radius:9px;overflow:hidden}
.kv > div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;font-size:12px}
.kv > div + div{border-top:1px solid var(--hx-line)}
.kv dt{color:var(--hx-ink-muted);flex:none}
.kv dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.agent-chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 5px;
  border-radius:7px;border:1px solid var(--hx-line);font-size:11.8px;color:var(--hx-ink-muted);
}
.agent-chip:hover{background:var(--hx-hover)}
.agent-chip.on{border-color:color-mix(in srgb,var(--hx-primary) 40%,var(--hx-line));background:var(--hx-primary-soft);color:var(--hx-primary)}
.agent-chip .avatar{width:20px;height:20px;font-size:9px;border-radius:5px}
.agent-model-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--hx-line)}
.agent-model-row:first-of-type{border-top:0}
.agent-model-row .am-name{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-model-row .avatar{width:24px;height:24px;font-size:10px;border-radius:6px}
.select.sm{width:118px;height:28px;font-size:11.5px;padding:0 6px;flex:none}
.field{margin-bottom:13px}
.field > label{display:block;font-size:11px;font-weight:500;color:var(--hx-ink-muted);margin-bottom:5px}
.input,.select,.textarea{
  width:100%;background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:8px;
  padding:7px 9px;font-size:12.3px;outline:none;
}
.input,.select{height:32px;padding-block:0}
.textarea{min-height:78px;resize:vertical;line-height:1.55;font-family:inherit}
.input:focus,.select:focus,.textarea:focus{border-color:var(--hx-primary);box-shadow:0 0 0 3px var(--hx-primary-soft)}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1;margin-bottom:0}
.dep-list{display:flex;flex-direction:column;gap:2px;border:1px solid var(--hx-line);border-radius:8px;padding:3px}
.dep{display:flex;align-items:center;gap:8px;font-size:11.8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.dep:hover{background:var(--hx-hover)}
.dep input{accent-color:var(--hx-primary);margin:0}
.dep .dep-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usage{margin-bottom:10px}
.usage-row{display:flex;justify-content:space-between;font-size:11px;color:var(--hx-ink-muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:4px;background:var(--hx-surface-muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--hx-primary)}
.bar i.warn{background:var(--hx-warning)}
.insp-empty{padding:26px 14px;text-align:center;color:var(--hx-ink-muted);font-size:12px;line-height:1.7}
.mini-card{border:1px solid var(--hx-line);border-radius:9px;background:var(--hx-surface);padding:10px 11px;font-size:12px;line-height:1.65}
.mini-card.danger{border-color:color-mix(in srgb,var(--hx-danger) 35%,var(--hx-line));background:color-mix(in srgb,var(--hx-danger) 6%,var(--hx-surface))}

  function resolvedTheme() {
    if (state.theme === 'light' || state.theme === 'dark') return state.theme;

  }
  function applyTheme() {
    if (state.theme === 'light' || state.theme === 'dark') {
      document.documentElement.dataset.theme = state.theme;
      document.documentElement.style.colorScheme = state.theme;
    } else {
      delete document.documentElement.dataset.theme;
      document.documentElement.style.colorScheme = '';
    }
  }
  function toggleTheme() {
    const next = resolvedTheme() === 'dark' ? 'light' : 'dark';
    state.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme();
    render();
  }

    if (mod === 'chat') {
      if (!findConv(state.chat.activeId)) state.chat.activeId = data.conversations[0] && data.conversations[0].id;
      state.chat.draft = '';
    }
    if (isMobile()) state.subOpen = false;
    render();
  }

  /* ============================================================
     Rail
     ============================================================ */
  const NAV = [
    ['chat', '对话', 'chat'],
    ['tasks', '任务', 'tasks'],
    ['templates', '模板', 'flow'],
    ['agents', 'Agent', 'users']
  ];
  function renderRail() {
    const ws = workspace();
    const dark = resolvedTheme() === 'dark';
    q('#rail').innerHTML =
      '<div class="rail-top">' +
        '<div class="logo" title="Hexa">' + icon('logo', 20) + '</div>' +
        '<button class="ws-btn" data-action="ws:menu" title="' + esc(ws.name) + '" aria-label="切换工作空间">' + esc(ws.name.slice(0, 1)) + '</button>' +
        (state.wsOpen ? wsPopover(ws) : '') +
      '</div>' +
      '<nav class="rail-nav">' +
        NAV.map((n) => '<button class="rail-btn' + (state.module === n[0] ? ' active' : '') + '" data-action="nav" data-id="' + n[0] + '" title="' + n[1] + '" aria-label="' + n[1] + '">' + icon(n[2]) + '</button>').join('') +
      '</nav>' +
      '<div class="rail-spacer"></div>' +
      '<div class="rail-bottom">' +
        '<button class="rail-btn' + (state.module === 'gateway' ? ' active' : '') + '" data-action="nav" data-id="gateway" title="Gateway 控制台" aria-label="Gateway 控制台">' + icon('server') + '</button>' +
        '<button class="rail-btn" data-action="theme" title="' + (dark ? '切换到浅色模式' : '切换到深色模式') + '" aria-label="切换主题">' + icon(dark ? 'sun' : 'moon') + '</button>' +
        '<div class="user-avatar" title="林屿 · 管理员">林</div>' +
      '</div>';
  }
  function wsPopover(ws) {
    return '<div class="ws-pop" role="menu">' +
      '<div class="ws-pop-label">工作空间</div>' +
      data.workspaces.map((w) =>
        '<button class="ws-item" data-action="ws:switch" data-id="' + w.id + '">' +
          '<span class="ws-ic">' + esc(w.name.slice(0, 1)) + '</span>' +
          '<span>' + esc(w.name) + '</span>' +
          (w.id === state.workspaceId ? '<span class="check">' + icon('check', 15) + '</span>' : '') +
        '</button>').join('') +
      '<div class="ws-sep"></div>' +
      '<button class="ws-action" data-action="ws:settings">' + icon('settings', 15) + '工作区设置</button>' +
      '<button class="ws-action" data-action="ws:new">' + icon('plus', 15) + '新建工作区</button>' +
      '<div class="ws-note">演示版本：工作空间共用同一份示例数据</div>' +
    '</div>';
  }

  /* ============================================================
     Sub navigation
     ============================================================ */
  function renderSubnav() {
    let html = '';
    if (state.module === 'chat') html = chatSubnav();
    else if (state.module === 'tasks') html = taskSubnav();
    else if (state.module === 'templates') html = templateSubnav();
    else if (state.module === 'agents') html = agentSubnav();
    else html = gatewaySubnav();
    q('#subnav').innerHTML = html;
  }

  function convItem(c) {
    const names = c.agents.map((id) => findAgent(id).name).join('、');
    return '<button class="conv-item' + (c.id === state.chat.activeId ? ' active' : '') + '" data-action="chat:open" data-id="' + c.id + '">' +
      '<span class="t">' + esc(c.title) + '</span>' +
      '<span class="tm">' + timeHM(c.updatedAt) + '</span>' +
      '<span class="m">' + esc(names) + ' · ' + c.msgs.filter((m) => m.role === 'user').length + ' 轮</span>' +
    '</button>';
  }
  function sortedConvs() {
    return data.conversations.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  }
  function chatListHTML() {
    const qtext = state.chat.query.trim().toLowerCase();
    const convs = sortedConvs();
    if (state.chat.searchOpen && qtext) {
      const hits = convs.filter((c) => c.title.toLowerCase().includes(qtext) || c.msgs.some((m) => (m.text || '').toLowerCase().includes(qtext)));
      if (!hits.length) return '<div class="empty-hint">没有匹配「' + esc(state.chat.query) + '」的对话。</div>';
      return '<div class="list-label">搜索结果 · ' + hits.length + '</div>' + hits.map(convItem).join('');
    }
    const active = convs.find((c) => c.id === state.chat.activeId);
    const rest = convs.filter((c) => c.id !== state.chat.activeId);
    const today = rest.filter((c) => isToday(c.updatedAt));
    const yesterday = rest.filter((c) => isYesterday(c.updatedAt));
    const older = rest.filter((c) => !isToday(c.updatedAt) && !isYesterday(c.updatedAt));
    let html = '';
    if (active) html += '<div class="list-label">当前对话</div>' + convItem(active);
    if (today.length) html += '<div class="list-label">今天</div>' + today.map(convItem).join('');
    if (yesterday.length) html += '<div class="list-label">昨天</div>' + yesterday.map(convItem).join('');
    if (older.length) html += '<div class="list-label">更早</div>' + older.map(convItem).join('');
    return html;
  }
  function chatSubnav() {
    return '<div class="sub-head">' +
      '<h2>对话 <span class="count">' + data.conversations.length + '</span></h2>' +
      '<div class="sub-head-actions">' +
        '<button class="icon-btn' + (state.chat.searchOpen ? ' on' : '') + '" data-action="chat:search" title="搜索对话" aria-label="搜索对话">' + icon('search') + '</button>' +
      '</div></div>' +
      (state.chat.searchOpen ? '<div class="sub-search"><input id="chat-search" placeholder="搜索对话或消息…" value="' + esc(state.chat.query) + '" aria-label="搜索对话"></div>' : '') +
      '<button class="new-btn" data-action="chat:new">' + icon('plus', 15) + '新对话</button>' +
      '<div class="sub-scroll" id="chat-list">' + chatListHTML() + '</div>';
  }

  function taskSubnav() {
    const sorted = data.tasks.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    const recent = sorted.slice(0, 4);
    return '<div class="sub-head"><h2>任务 <span class="count">' + data.tasks.length + '</span></h2>' +
      '<div class="sub-head-actions"><button class="icon-btn" data-action="tasks:new" title="新建任务">' + icon('plus') + '</button></div></div>' +
      '<button class="new-btn" data-action="tasks:new">' + icon('plus', 15) + '新建任务</button>' +
      '<div class="sub-scroll">' +
        '<div class="list-label">任务列表</div>' +
        sorted.map((t) => '<button class="nav-row' + (t.id === state.tasks.activeId ? ' active' : '') + '" data-action="tasks:open" data-id="' + t.id + '">' +
          '<span class="dot" style="background:' + circleColor(t.status) + '"></span>' +
          '<span class="nm">' + esc(t.name) + '</span>' +
          '<span class="tm">' + (t.progress || 0) + '%</span>' +
        '</button>').join('') +
        '<div class="list-label">最近任务</div>' +
        recent.map((t) => '<button class="nav-row" data-action="tasks:open" data-id="' + t.id + '">' +
          icon('clock', 14) + '<span class="nm">' + esc(t.name) + '</span><span class="tm">' + relTime(t.updatedAt) + '</span>' +
        '</button>').join('') +
      '</div>';
  }

  function templateSubnav() {
    const sorted = data.templates.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    return '<div class="sub-head"><h2>模板 <span class="count">' + data.templates.length + '</span></h2>' +
      '<div class="sub-head-actions"><button class="icon-btn" data-action="templates:new" title="新建模板">' + icon('plus') + '</button></div></div>' +
      '<button class="new-btn" data-action="templates:new">' + icon('plus', 15) + '新建模板</button>' +
      '<div class="sub-scroll">' +
        '<div class="list-label">模板列表</div>' +
        sorted.map((t) => '<button class="nav-row' + (t.id === state.templates.activeId ? ' active' : '') + '" data-action="templates:open" data-id="' + t.id + '">' +
          icon('flow', 15) + '<span class="nm">' + esc(t.name) + '</span>' +
          '<span class="tm">' + (t.draft ? '草稿' : 'v' + t.version) + '</span>' +
        '</button>').join('') +
        '<div class="list-label">最近编辑</div>' +
        sorted.slice(0, 3).map((t) => '<button class="nav-row" data-action="templates:open" data-id="' + t.id + '">' +
          '<span class="nm">' + esc(t.name) + '</span><span class="tm">' + ago(t.updatedAt) + '</span>' +
        '</button>').join('') +
      '</div>';
  }

  function agentSubnav() {
    const favs = data.agents.filter((a) => a.favorite).length;
    const rows = [
      ['all', '全部 Agent', 'users', data.agents.length],
      ['recent', '最近使用', 'clock', data.agents.length],
      ['favorite', '收藏', 'star', favs]
    ];
    return '<div class="sub-head"><h2>Agent <span class="count">' + data.agents.length + '</span></h2></div>' +
      '<div class="sub-scroll" style="padding-top:10px">' +
        rows.map((r) => '<button class="nav-row' + (state.agents.filter === r[0] ? ' active' : '') + '" data-action="agents:filter" data-id="' + r[0] + '">' +
          icon(r[2], 16) + '<span class="nm">' + r[1] + '</span><span class="count">' + r[3] + '</span>' +
        '</button>').join('') +
        '<div class="list-label">团队</div>' +
        data.agents.map((a) => '<button class="nav-row" data-action="agents:edit" data-id="' + a.id + '">' +
          avatar(a.id, 22) + '<span class="nm">' + esc(a.name) + '</span>' +
        '</button>').join('') +
      '</div>';
  }

  function gatewaySubnav() {
    return '<div class="sub-head"><h2>Gateway</h2></div>' +
      '<div class="sub-scroll" style="padding-top:10px">' +
        '<button class="nav-row active">' + icon('bolt', 16) + '<span class="nm">运行概览</span></button>' +
        '<button class="nav-row">' + icon('server', 16) + '<span class="nm">模型路由</span></button>' +
        '<button class="nav-row">' + icon('file', 16) + '<span class="nm">请求日志</span></button>' +
        '<div class="empty-hint">Gateway 控制台为后续阶段接入，当前展示演示数据。</div>' +
      '</div>';
  }

  /* ============================================================
     Main — chat
     ============================================================ */
  function chatMain() {
    const conv = activeConv();
    const typing = conv.typing || [];
    const busy = typing.length > 0;
    const msgs = conv.msgs || [];
    const showEmpty = msgs.length === 0 && !busy;

    return '<header class="main-head">' +
      '<button class="icon-btn mobile-only" data-action="sub:toggle" aria-label="打开导航">' + icon('menu') + '</button>' +
      '<div class="head-title"><h1 class="mh-title">' + esc(conv.title) + '</h1>' +
        (busy ? '<span class="pill blue">' + typing.length + ' 个 Agent 回复中</span>' : '<span class="pill green">已就绪</span>') +
      '</div>' +
      '<div class="head-actions">' +
        '<button class="icon-btn" data-action="chat:more" title="更多操作" aria-label="更多操作">' + icon('more') + '</button>' +
        '<button class="icon-btn' + (state.chat.inspector ? ' on' : '') + '" data-action="chat:inspector" title="会话检查器" aria-label="会话检查器">' + icon('panel') + '</button>' +
      '</div>' +
    '</header>' +
    '<div class="chat-body" id="chat-scroll"><div class="chat-inner">' +
      (showEmpty ? chatEmpty() : msgs.map(msgHTML).join('')) +
      (busy ? typingHTML(typing) : '') +
    '</div></div>' +
    composerHTML(conv);
  }

  function chatEmpty() {
    return '<div class="chat-empty">' +
      '<h2>开始一轮多 Agent 协作</h2>' +
      '<p>在右侧会话面板选择参与的 Agent 和模型。每条消息会得到独立回复，并由总结 Agent 汇总。</p>' +
      '<div class="suggest-list">' +
        '<button class="suggest" data-action="chat:suggest" data-text="帮我们评估一下面向中小团队的 AI 协作产品方案，重点看市场机会、技术可行性和合规风险。">评估一个产品方案的可行性与风险</button>' +
        '<button class="suggest" data-action="chat:suggest" data-text="对比我们现在和竞品在方案评审流程上的差异，给出三个改进点。">对比竞品，找出三个改进点</button>' +
        '<button class="suggest" data-action="chat:suggest" data-text="把本周的用户反馈整理成下月的产品改进主题，并说明优先级。">整理用户反馈，输出改进主题</button>' +
      '</div>' +
    '</div>';
  }

  function msgHTML(m) {
    if (m.role === 'user') {
      return '<div class="msg user"><div><div class="bubble">' + rich(m.text) + '</div><span class="msg-time">' + timeHM(m.time) + '</span></div></div>';
    }
    const a = findAgent(m.agent);
    let inner = '';
    if (m.role === 'summary') {
      inner = '<div class="summary-tag">' + icon('layers', 12) + '最终总结</div>' + rich(m.text) + (m.workflow ? workflowCard(m.workflow) : '');
    } else {
      inner = rich(m.text) + toolChips(m.tools) + fileCards(m.files) + (m.workflow ? workflowCard(m.workflow) : '');
    }
    return '<div class="msg ' + (m.role === 'summary' ? 'summary' : 'agent') + '">' +
      avatar(m.agent, 28) +
      '<div class="msg-main">' +
        '<div class="msg-meta"><strong>' + esc(a.name) + '</strong>' +
          '<span class="model-chip">' + esc(m.model || a.model) + '</span>' +
          '<span class="msg-time tm" style="font-size:10.5px;color:var(--hx-ink-muted)">' + timeHM(m.time) + '</span>' +
          '<span class="msg-state">已完成</span>' +
        '</div>' +
        '<div class="msg-card">' + inner + '</div>' +
      '</div>' +
    '</div>';
  }
  function toolChips(tools) {
    if (!tools || !tools.length) return '';
    return '<div class="chips">' + tools.map((t) => '<span class="chip">' + icon('wrench', 12) + esc(t.label) + '</span>').join('') + '</div>';
  }
  function fileCards(files) {
    if (!files || !files.length) return '';
    return files.map((f) => '<div class="file-card"><span class="file-ic">' + icon('file', 15) + '</span><span style="min-width:0"><span class="fc-name">' + esc(f.name) + '</span><span class="fc-meta">' + esc(f.meta) + '</span></span></div>').join('');
  }
  function workflowCard(wf) {
    return '<div class="workflow-card">' +
      '<span class="wf-ic">' + icon('flow', 16) + '</span>' +
      '<span style="min-width:0"><span class="wf-t">已生成工作流 · ' + esc(wf.title) + '</span><span class="wf-m">' + esc(wf.meta) + ' · 可创建任务</span></span>' +
      '<span class="wf-actions">' +
        '<button class="btn sm secondary" data-action="templates:open" data-id="' + wf.templateId + '">查看模板</button>' +
        '<button class="btn sm primary" data-action="chat:create-task" data-id="' + wf.templateId + '">创建任务</button>' +
      '</span>' +
    '</div>';
  }
  function typingHTML(ids) {
    return ids.map((id) => '<div class="typing">' + avatar(id, 24) + '<span>' + esc(findAgent(id).name) + ' 正在思考</span><span class="dots"><i></i><i></i><i></i></span></div>').join('');
  }
  function composerHTML(conv) {
    const busy = (conv.typing || []).length > 0;
    const draft = state.chat.draft || '';
    return '<div class="composer-wrap"><div class="composer">' +
      '<textarea id="composer" rows="1" placeholder="发送消息给 ' + conv.agents.length + ' 个 Agent…" aria-label="消息输入框">' + esc(draft) + '</textarea>' +
      '<div class="composer-bar">' +
        '<div class="composer-tools">' +
          '<button class="icon-btn" data-action="chat:attach" title="添加附件" aria-label="添加附件">' + icon('clip', 16) + '</button>' +
          '<button class="icon-btn" data-action="chat:tools" title="工具" aria-label="工具">' + icon('wrench', 16) + '</button>' +
          '<button class="icon-btn" data-action="chat:context" title="上下文" aria-label="上下文">' + icon('layers', 16) + '</button>' +
        '</div>' +
        '<span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>' +
        (busy
          ? '<button class="send-btn stop" data-action="chat:stop" title="停止回复" aria-label="停止回复">' + icon('stop', 14) + '</button>'
          : '<button id="send-btn" class="send-btn ' + (draft.trim() ? '' : 'dim') + '" data-action="chat:send" title="发送" aria-label="发送">' + icon('send', 15) + '</button>') +
      '</div>' +
    '</div></div>';
  }

  /* ============================================================
     Main — tasks
     ============================================================ */
  function taskListMain() {
    const tasks = data.tasks.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    return '<header class="main-head">' +
      '<button class="icon-btn mobile-only" data-action="sub:toggle" aria-label="打开导航">' + icon('menu') + '</button>' +
      '<div class="head-title"><h1 class="mh-title">任务</h1><span class="muted-count">' + tasks.length + ' 个任务</span></div>' +
      '<div class="head-actions"><button class="btn secondary" data-action="tasks:new">' + icon('plus', 15) + '<span class="btn-label">新建任务</span></button></div>' +
    '</header>' +
    '<div class="page-scroll">' +
      '<div class="page-head"><h2>全部任务</h2><p>每次任务在创建时固定模板版本与配置快照，之后修改模板不会影响已有任务。</p></div>' +
      '<div class="table-card">' +
        '<div class="table-head"><span>任务</span><span>模板</span><span>状态</span><span>进度</span><span>最近更新</span><span></span></div>' +
        tasks.map(taskRow).join('') +
        (tasks.length ? '' : '<div class="empty-hint">还没有任务。从模板创建第一个任务。</div>') +
      '</div>' +
    '</div>';
  }
  function taskRow(t) {
    const progCls = t.status === '已完成' ? 'done' : t.status === '失败' ? 'fail' : (t.status === '已停止' || t.status === '已中断') ? 'stopped' : '';
    return '<button class="task-row" data-action="tasks:open" data-id="' + t.id + '">' +
      '<span class="tr-name"><strong>' + esc(t.name) + '</strong><span class="tr-sub">' + esc(t.num) + ' · 创建于 ' + relTime(t.createdAt) + '</span></span>' +
      '<span class="tr-tpl"><span class="tpl-chip">' + esc(t.templateName) + '</span><span class="tm">' + esc(t.templateVersion) + '</span></span>' +
      '<span class="tr-status">' + statusPill(t.status) + '</span>' +
      '<span class="tr-prog"><span class="prog ' + progCls + '"><i style="width:' + (t.progress || 0) + '%"></i></span><span class="tm">' + (t.progress || 0) + '%</span></span>' +
      '<span class="tr-updated tm">' + relTime(t.updatedAt) + '</span>' +
      '<span class="chev">' + icon('right', 15) + '</span>' +
    '</button>';
  }

  function taskDetailMain(t) {
    const nodes = t.snapshot.nodes;
    const isRunning = t.status === '运行中';
    const canRun = t.status === '等待执行' || t.status === '已停止' || t.status === '已中断';
    const canRetry = t.status === '失败';
    const runLabel = t.status === '已中断' ? '恢复' : t.status === '已停止' ? '继续' : '运行';
    return '<header class="main-head detail-head">' +
      '<button class="icon-btn" data-action="tasks:back" title="返回任务列表" aria-label="返回任务列表">' + icon('left') + '</button>' +
      '<div class="head-title"><h1 class="mh-title">' + esc(t.name) + '</h1>' + statusPill(t.status) +
        '<span class="tpl-chip">' + esc(t.templateName) + ' ' + esc(t.templateVersion) + '</span>' +
      '</div>' +
      '<div class="head-actions wrap">' +
        (canRun ? '<button class="btn primary" data-action="tasks:run">' + icon('play', 14) + runLabel + '</button>' : '') +
        (isRunning ? '<button class="btn secondary" data-action="tasks:stop">' + icon('stop', 12) + '停止</button>' : '') +
        (canRetry ? '<button class="btn primary" data-action="tasks:retry">' + icon('refresh', 14) + '重试失败节点</button>' : '') +
        (isRunning || t.status === '等待执行' ? '<button class="btn ghost" data-action="tasks:fail" title="演示：让下一个执行中的节点失败">' + icon('zap', 14) + '模拟失败</button>' : '') +
        '<button class="btn ghost" data-action="tasks:more" title="更多操作">' + icon('more', 16) + '</button>' +
        '<button class="icon-btn' + (state.tasks.inspector ? ' on' : '') + '" data-action="tasks:inspector" title="任务详情面板" aria-label="任务详情面板">' + icon('panel') + '</button>' +
      '</div>' +
    '</header>' +
    '<div class="run-area">' +
      '<div class="run-stage-wrap">' +
        '<div class="canvas-toolbar">' +
          '<span class="toolbar-title">运行流程图 · 只读</span>' +
          '<span class="progress-inline">' + (t.progress || 0) + '%</span>' +
          '<div class="legend">' +
            '<span><i style="background:var(--hx-success)"></i>已完成</span>' +
            '<span><i style="background:var(--hx-primary)"></i>运行中</span>' +
            '<span><i style="background:var(--hx-ink-muted)"></i>等待</span>' +
            '<span><i style="background:var(--hx-danger)"></i>失败</span>' +
            '<span><i style="background:var(--hx-warning)"></i>阻塞</span>' +
          '</div>' +
        '</div>' +
        '<div class="canvas-scroll"><div class="canvas-stage" id="run-stage"><div class="canvas-world" id="run-world">' +
          '<svg class="edges" id="run-edges"></svg>' +
          nodes.map((n) => runNodeHTML(t, n)).join('') +
        '</div></div></div>' +
      '</div>' +
    '</div>';
  }

  function nodeDisplay(t, n) {
    const r = t.runs[n.id] || { status: 'pending' };
    if (r.status === 'pending') {
      const dep = n.deps.find((d) => t.runs[d] && t.runs[d].status === 'failed');
      if (dep) return { status: 'blocked', reason: '被「' + nodeName(t, dep) + '」阻塞' };
      const waiting = n.deps.find((d) => !t.runs[d] || t.runs[d].status !== 'done');
      if (waiting) return { status: 'pending', reason: '等待「' + nodeName(t, waiting) + '」' };
    }
    return { status: r.status, reason: '' };
  }
  function nodeName(t, id) {
    const n = t.snapshot.nodes.find((x) => x.id === id);
    return n ? n.name : id;
  }
  function runNodeHTML(t, n) {
    const d = nodeDisplay(t, n);
    const r = t.runs[n.id] || {};

      : d.status === 'pending' && d.reason ? '<span class="blocked">' + esc(d.reason) + '</span>'
      : esc(a.name) + ' · ' + esc(n.model);
    return '<div class="flow-node status-' + d.status + '" data-node="' + n.id + '" style="left:' + n.x + 'px;top:' + n.y + 'px">' +

  }

  /* ============================================================
     Template — AI orchestration
     ============================================================ */
  function aiGreeting(t) {
    return { role: 'assistant', text: '想怎么编排「' + t.name + '」？描述目标、先后关系和参与的 Agent，我来生成流程图；也可以先选下面的示例。' };
  }

  function aiState(t) {
    const empty = { tplId: t.id, msgs: [aiGreeting(t)], draft: '', busy: false, proposal: null };
    const ai = state.templates.ai;
    if (!ai || ai.tplId !== t.id) {
      state.templates.ai = empty;
      return state.templates.ai;
    }
    if (!ai.msgs.length) ai.msgs = [aiGreeting(t)];
    return ai;
  }

  function canvasNodes(t) {
    const ai = state.templates.ai;
    if (ai && ai.tplId === t.id && ai.proposal && state.templates.mode === 'ai') return ai.proposal.nodes;
    return t.nodes;
  }

  function aiClearTimer() {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  }

  function setOrchMode(mode) {
    const t = editingTemplate();
    if (!t) return;
    if (mode === 'ai') aiState(t);
    state.templates.mode = mode === 'ai' ? 'ai' : 'manual';
    render();
    if (mode === 'ai') {
      const box = q('#ai-input');
      if (box) box.focus();
    }
  }

  function sendAIMessage() {
    const t = editingTemplate();
    if (!t) return;
    const ai = aiState(t);
    if (ai.busy) return;
    const box = q('#ai-input');
    const text = (box ? box.value : ai.draft || '').trim();
    if (!text) { if (box) box.focus(); return; }
    ai.msgs.push({ role: 'user', text: text });
    ai.draft = '';
    ai.proposal = null;
    ai.busy = true;
    state.templates.mode = 'ai';
    render();
    const tplId = t.id;
    aiClearTimer();
    aiTimer = setTimeout(function () {
      aiTimer = null;
      const cur = state.templates.ai;
      const tpl = findTemplate(tplId);
      if (!cur || cur.tplId !== tplId || !tpl) return;
      const flow = buildFlowFromPrompt(text);
      cur.busy = false;
      cur.proposal = flow;
      cur.msgs.push({
        role: 'assistant',
        text: '已生成「' + flow.title + '」：' + flow.nodes.length + ' 个节点、' + flow.edgeCount + ' 条依赖。画布中是预览，确认后写入模板，再切回拖拽编辑微调。',
        flow: flow
      });
      render();
    }, 950);
  }

  function applyAIProposal() {
    const t = editingTemplate();
    const ai = state.templates.ai;
    if (!t || !ai || !ai.proposal) return;
    t.nodes = clone(ai.proposal.nodes);
    t.nodes.forEach(function (n) { n.deps = n.deps || []; });
    markDraft(t);
    state.templates.nodeId = t.nodes[0] ? t.nodes[0].id : null;
    ai.proposal = null;
    ai.msgs.push({ role: 'assistant', text: '已写入模板并标记为草稿。切到「拖拽编辑」可以继续调整位置、Agent 与提示词。' });
    state.templates.mode = 'manual';
    save();
    render();
    toast('AI 流程图已写入模板草稿');
  }

  function discardAIProposal() {
    const ai = state.templates.ai;
    if (!ai || !ai.proposal) return;
    ai.proposal = null;
    render();
    toast('已取消 AI 预览');
  }

  function buildFlowFromPrompt(text) {
    const q = String(text || '').trim();
    const has = function (words) { return words.some(function (w) { return q.indexOf(w) >= 0; }); };
    let spec;
    if (has(['增长', '实验', '拉新', '留存', '转化'])) {
      spec = {
        title: '用户研究与增长实验',
        nodes: [
          { name: '用户调研', agent: 'a1', prompt: '访谈目标用户，梳理需求、动机与流失原因。', deps: [] },
          { name: '增长实验设计', agent: 'a2', prompt: '基于调研结论设计三个可执行、可度量的增长实验。', deps: [0] },
          { name: '可行性评审', agent: 'a3', prompt: '评估实验的成本、风险与合规要求，标注优先级。', deps: [1] },
          { name: '增长方案', agent: 'a4', type: 'summary', prompt: '汇总调研与评审结论，输出分阶段的增长方案。', deps: [2] }
        ]
      };
    } else if (has(['客服', '工单', '反馈', '客诉', '投诉'])) {
      spec = {
        title: '客服反馈洞察',
        nodes: [
          { name: '工单聚类', agent: 'a1', prompt: '对客服工单做主题聚类，统计各主题的频次与趋势。', deps: [] },
          { name: '访谈洞察', agent: 'a2', prompt: '结合用户访谈，解释高频问题背后的真实诉求。', deps: [] },
          { name: '主题归纳', agent: 'a3', prompt: '合并聚类与访谈结论，提炼可改进的产品主题。', deps: [0, 1] },
          { name: '改进方案', agent: 'a4', type: 'summary', prompt: '按影响与成本排序，输出改进方案与验证方式。', deps: [2] }
        ]
      };
    } else if (has(['文案', '内容', '写作', '稿件', '文章'])) {
      spec = {
        title: '内容创作流程',
        nodes: [
          { name: '受众分析', agent: 'a1', prompt: '明确目标读者、阅读场景与核心信息。', deps: [] },
          { name: '内容草稿', agent: 'a2', prompt: '按受众分析输出结构完整的第一版草稿。', deps: [] },
          { name: '事实核查', agent: 'a3', prompt: '核查数据、引用与表述风险，标注需要修改的部分。', deps: [0, 1] },
          { name: '成稿汇编', agent: 'a4', type: 'summary', prompt: '合并草稿与核查意见，输出终稿与发布清单。', deps: [2] }
        ]
      };
    } else if (has(['市场', '技术', '架构', '风险', '方案'])) {
      spec = {
        title: '市场与技术并行评估',
        nodes: [
          { name: '市场分析', agent: 'a1', prompt: '分析目标产品的市场空间、目标用户与竞品格局，输出关键假设与机会点。', deps: [] },
          { name: '技术评估', agent: 'a2', prompt: '评估技术可行性、架构约束与实现成本，输出可选路径。', deps: [] },
          { name: '风险评审', agent: 'a3', prompt: '综合市场与技术结论，识别主要风险并给出缓解建议。', deps: [0, 1] },
          { name: '方案总结', agent: 'a4', type: 'summary', prompt: '汇总三方结论，输出结论明确、可执行的方案。', deps: [2] }
        ]
      };
    } else {
      const steps = q.split(/[，,。；;、\n]|然后|接着|最后|再/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length >= 2; }).slice(0, 4);
      const names = steps.length >= 2 ? steps : ['需求分析', '方案设计', '方案总结'];
      spec = {
        title: '按描述生成流程',
        nodes: names.map(function (name, i) {
          const last = i === names.length - 1 && names.length >= 2;
          return {
            name: name.length > 10 ? name.slice(0, 10) + '…' : name,
            agent: last ? 'a4' : ['a1', 'a2', 'a3'][i % 3],
            type: last ? 'summary' : 'agent',
            prompt: name,
            deps: i === 0 ? [] : [i - 1]
          };
        })
      };
    }

    const nodes = spec.nodes.map(function (s) {
      const agent = findAgent(s.agent);
      return {
        id: uid('n'),
        name: s.name,
        type: s.type || 'agent',
        agent: agent.id,
        model: agent.model,
        x: 0, y: 0,
        prompt: s.prompt || s.name,
        timeout: 600,
        retry: 1,
        strategy: s.type === 'summary' ? '仅摘要' : '全部输出',
        input: '任务输入',
        deps: []
      };
    });
    spec.nodes.forEach(function (s, i) {
      nodes[i].deps = (s.deps || []).map(function (d) { return nodes[d].id; }).filter(Boolean);
    });

    const byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    const levelOf = {};
    function level(n) {
      if (levelOf[n.id] != null) return levelOf[n.id];
      levelOf[n.id] = 0;
      levelOf[n.id] = n.deps.length
        ? Math.max.apply(null, n.deps.map(function (d) { return level(byId[d]) + 1; })) : 0;
      return levelOf[n.id];
    }
    nodes.forEach(level);
    const cols = {};
    let maxLevel = 0;
    nodes.forEach(function (n) {
      const l = level(n);
      maxLevel = Math.max(maxLevel, l);
      (cols[l] = cols[l] || []).push(n);
    });
    const gapX = maxLevel <= 0 ? 0 : Math.min(320, Math.floor((980 - 190 - 80) / maxLevel));
    Object.keys(cols).forEach(function (k) {
      const arr = cols[k];
      const step = Math.min(112, 400 / Math.max(1, arr.length));
      arr.forEach(function (n, i) {
        n.x = Math.round(40 + Number(k) * gapX);
        n.y = Math.round(clamp(190 + (i - (arr.length - 1) / 2) * step, 30, 440));
      });
    });

    const edgeCount = nodes.reduce(function (a, n) { return a + n.deps.length; }, 0);
    return { title: spec.title, nodes: nodes, edgeCount: edgeCount };
  }

  /* ============================================================
     Render
     ============================================================ */
  function render() {
    applyTheme();
    const ae = document.activeElement;
    let focusInfo = null;
    if (ae && (ae.id === 'composer' || ae.id === 'chat-search' || ae.id === 'ai-input')) {
      focusInfo = { id: ae.id, start: ae.selectionStart, end: ae.selectionEnd };
    }
    renderRail();
    renderSubnav();
    const main = q('#main');
    if (state.module === 'chat') main.innerHTML = chatMain();
    else if (state.module === 'tasks') main.innerHTML = state.tasks.activeId ? taskDetailMain(activeTask()) : taskListMain();
    else if (state.module === 'templates') main.innerHTML = state.templates.activeId ? templateEditorMain(editingTemplate()) : templateListMain();
    else if (state.module === 'agents') main.innerHTML = agentMain();
    else main.innerHTML = gatewayMain();
    renderInspector();
    renderModal();
    renderToast();
    afterRender();
    if (focusInfo) {
      const target = q('#' + focusInfo.id);
      if (target) {
        target.focus();
        try { target.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) {}
      }
    }
  }

  function afterRender() {
    const app = q('#app');
    app.classList.toggle('sub-open', state.subOpen);
    if (state.module === 'chat') {
      const sc = q('#chat-scroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
      const ta = q('#composer');
      if (ta) {
        ta.style.height = 'auto';
        ta.style.height = Math.min(150, ta.scrollHeight) + 'px';
      }
    }
    if (state.module === 'tasks' && state.tasks.activeId) {
      fitRunCanvas();
      drawEdges('run');
    }
    if (state.module === 'templates' && state.templates.activeId) {
      applyZoom();
      drawEdges('tpl');
      const ta = q('#ai-input');
      if (ta) {
        ta.style.height = 'auto';
        ta.style.height = Math.min(90, ta.scrollHeight) + 'px';
      }
      const log = q('#ai-log');
      if (log) log.scrollTop = log.scrollHeight;
    }
  }

  function fitRunCanvas() {
    const wrap = q('#run-stage');
    const world = q('#run-world');
    if (!wrap || !world) return;
    const host = q('.canvas-scroll');
    const avail = host ? host.clientWidth - 40 : 900;
    const scale = clamp(avail / 980, 0.35, 1);
    world.style.transform = 'scale(' + scale + ')';
    wrap.style.width = 980 * scale + 'px';
    wrap.style.height = 540 * scale + 'px';
  }

  function applyZoom() {
    const host = q('#tpl-scroll');
    const stage = q('#tpl-stage');
    const world = q('#tpl-world');
    if (!host || !stage || !world) return;
    const fit = clamp((host.clientWidth - 40) / 980, 0.32, 1);
    const z = state.templates.zoom == null ? fit : state.templates.zoom;
    state.templates.effZoom = z;
    world.style.transform = 'scale(' + z + ')';
    stage.style.width = 980 * z + 'px';
    stage.style.height = 540 * z + 'px';
    const pct = q('.zoom-controls span');
    if (pct) pct.textContent = Math.round(z * 100) + '%';
  }

  function drawEdges(scope) {
    const world = q(scope === 'run' ? '#run-world' : '#tpl-world');
    const svg = q(scope === 'run' ? '#run-edges' : '#tpl-edges');
    if (!world || !svg) return;
    const t = scope === 'run' ? activeTask() : editingTemplate();
    if (!t) return;
    const nodes = scope === 'run' ? t.snapshot.nodes : canvasNodes(t);
    const pos = {};
    qa('.flow-node', world).forEach((el) => {
      pos[el.dataset.node] = {
        x: parseFloat(el.style.left) || 0,
        y: parseFloat(el.style.top) || 0,
        w: el.offsetWidth,
        h: el.offsetHeight
      };
    });
    const paths = [];
    nodes.forEach((n) => (n.deps || []).forEach((d) => {
      const a = pos[d], b = pos[n.id];
      if (!a || !b) return;
      const x1 = a.x + a.w, y1 = a.y + a.h / 2;
      const x2 = b.x, y2 = b.y + b.h / 2;
      const c = Math.max(40, Math.abs(x2 - x1) / 2);
      paths.push('<path class="edge" d="M' + x1 + ' ' + y1 + ' C' + (x1 + c) + ' ' + y1 + ' ' + (x2 - c) + ' ' + y2 + ' ' + x2 + ' ' + y2 + '" marker-end="url(#arrow-' + scope + ')"/>');
    }));
    svg.innerHTML = '<defs><marker id="arrow-' + scope + '" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hx-edge)"/></marker></defs>' + paths.join('');
  }

     Chat actions
     ============================================================ */
  function newChat() {
    const conv = {
      id: uid('conv'), title: '新对话', agents: ['a1'], summaryAgent: 'a4',
      models: { a1: 'Opus 5.5' }, msgs: [], updatedAt: nowIso()
    };

  function openChat(id) {
    state.chat.activeId = id;

  function sendChat() {
    const conv = activeConv();
    if (!conv) return;
    if ((conv.typing || []).length) return;
    const text = (state.chat.draft || '').trim();
    if (!text) return;
    conv.msgs.push({ id: uid('m'), role: 'user', text: text, time: nowIso() });
    if (conv.title === '新对话') conv.title = text.slice(0, 18) + (text.length > 18 ? '…' : '');
    conv.updatedAt = nowIso();
    state.chat.draft = '';
    const agents = conv.agents.slice();
    conv.typing = agents.slice();
    save();
    render();

    agents.forEach((aid, i) => {
      const timer = setTimeout(() => {
        const a = findAgent(aid);
        conv.typing = (conv.typing || []).filter((x) => x !== aid);
        conv.msgs.push({
          id: uid('m'), role: 'agent', agent: aid, model: conv.models[aid] || a.model,
          text: replyFor(a, text), time: nowIso(),
          tools: toolsFor(aid), files: filesFor(aid)
        });
        conv.updatedAt = nowIso();
        save(); render();
        if (i === agents.length - 1) {
          const t2 = setTimeout(finishRound, 950);
          chatTimers.push(t2);
        }
      }, 850 + i * 1150);
      chatTimers.push(timer);
    });

    function finishRound() {
      const sum = findAgent(conv.summaryAgent);
      const names = agents.map((id) => findAgent(id).name).join('、');
      const first = conv.msgs.filter((m) => m.role === 'agent').pop();
      conv.msgs.push({
        id: uid('m'), role: 'summary', agent: sum.id, model: sum.model, time: nowIso(),
        text: '综合 ' + names + ' 的分析，本轮结论如下：\n\n**共识**：' + (first ? first.text.split('\n')[0].replace(/\*\*/g, '') : '方向基本一致') + '\n\n**建议下一步**：把结论固化为可复用模板，创建任务并行执行，并保留本轮会话作为决策记录。',
        workflow: conv.msgs.some((m) => m.workflow) ? null : { templateId: 'tpl-1', title: 'AI 产品方案评估', meta: '4 个节点 · v1' }
      });
      conv.typing = [];
      conv.updatedAt = nowIso();
      save(); render();
    }
  }

  function stopChat() {
    chatTimers.forEach((t) => clearTimeout(t));
    chatTimers.length = 0;
    const conv = activeConv();
    conv.typing = [];
    save();
    render();
    toast('已停止本轮回复');
  }

  function replyFor(a, text) {
    const brief = text.replace(/\s+/g, ' ').slice(0, 34);

      a2: '从工程角度看「' + brief + '」：\n\n- 现有架构可以承载，主要改造集中在调度与快照；\n- 需要先明确节点失败后的重试边界，避免重复执行；\n- 建议首版限制并行度并记录每次运行的完整输入输出。\n\n成本估算：10 人团队 6–8 周可交付可用版本，主要风险在工具权限与出网控制。',
      a3: '我关注三类风险：\n\n1. **合规**：客户内容进入模型前需要脱敏与留存策略；\n2. **安全**：执行环境的最小权限与出网白名单；\n3. **交付**：重试与恢复过程的状态一致性。\n\n建议先把权限与日志基线做进首版，再开放更多工具。整体风险等级：中，可控。',
      a4: '我先把任务拆成三条并行线：市场判断、技术可行性、风险评审。每条线给出明确产出格式，最后汇总为单一结论。'
    };
    return base[a.id] || base.a1;
  }

  /* ============================================================
     Task engine
     ============================================================ */
  const runTimers = {};
  function logTask(t, node, msg) {
    t.logs = t.logs || [];
    t.logs.push({ time: timeHM(nowIso()), node: node, msg: msg });
  }
  function updateProgress(t) {
    const nodes = t.snapshot.nodes;
    const done = nodes.filter((n) => (t.runs[n.id] || {}).status === 'done').length;
    t.progress = Math.round((done / nodes.length) * 100);
  }

  function runTask(taskId) {
    const t = findTask(taskId);
    if (!t || t.status === '运行中') return;
    if (t.status === '已完成') { toast('任务已完成'); return; }
    Object.keys(t.runs || {}).forEach((k) => {
      if (t.runs[k].status === 'running') t.runs[k].status = 'pending';
    });
    t.status = '运行中';
    t.updatedAt = nowIso();
    logTask(t, '调度', '任务开始运行，使用模板快照 ' + t.templateVersion);
    save(); render();
    tick(t);
  }

  function tick(t) {
    if (t.status !== '运行中') return;
    const nodes = t.snapshot.nodes;
    const ready = nodes.filter((n) => {
      const r = t.runs[n.id] || { status: 'pending' };
      return r.status === 'pending' && (n.deps || []).every((d) => (t.runs[d] || {}).status === 'done');
    });
    if (!ready.length) {
      const running = nodes.some((n) => (t.runs[n.id] || {}).status === 'running');
      if (running) return;
      const allDone = nodes.every((n) => (t.runs[n.id] || {}).status === 'done');
      const anyFailed = nodes.some((n) => (t.runs[n.id] || {}).status === 'failed');
      if (allDone) {
        t.status = '已完成';
        t.progress = 100;
        const summaryNode = nodes.find((n) => n.type === 'summary');
        t.summary = (summaryNode && t.runs[summaryNode.id] && t.runs[summaryNode.id].output) || '任务已完成。';
        logTask(t, '调度', '全部节点完成，任务结束');
      } else if (anyFailed) {
        const failedNode = nodes.find((n) => (t.runs[n.id] || {}).status === 'failed');
        t.status = '失败';
        logTask(t, '调度', '存在失败节点' + (failedNode ? '「' + failedNode.name + '」' : '') + '，下游节点被阻塞');
      }
      t.updatedAt = nowIso();
      save(); render();
      return;
    }
    ready.forEach((n) => {
      const r = (t.runs[n.id] = t.runs[n.id] || { status: 'pending', attempts: 0, logs: [] });
      r.status = 'running';
      r.attempts = (r.attempts || 0) + 1;
      r.error = '';
      logTask(t, n.name, '开始执行（第 ' + r.attempts + ' 次）');
      const willFail = takeFail(n);
      const timer = setTimeout(() => finishNode(t, n, willFail), willFail ? 1500 : 1700 + Math.random() * 900);
      (runTimers[t.id] = runTimers[t.id] || []).push(timer);
    });
    updateProgress(t);
    save(); render();
  }

  function takeFail(n) {
    if (!state.failArmed) return false;
    if (n.type === 'summary') return false;
    state.failArmed = false;
    return true;
  }

  function finishNode(t, n, failed) {
    if (t.status !== '运行中') return;
    const r = t.runs[n.id];
    if (!r || r.status !== 'running') return;
    if (failed) {
      r.status = 'failed';
      r.error = '模型响应超时（超过 ' + n.timeout + 's）。可直接重试该节点，已完成节点不会重复执行。';
      r.duration = n.timeout;
      logTask(t, n.name, '执行失败：模型响应超时（超过 ' + n.timeout + 's）');
      const blocked = t.snapshot.nodes.filter((x) => (x.deps || []).includes(n.id));
      blocked.forEach((b) => {
        if ((t.runs[b.id] || {}).status === 'pending') logTask(t, b.name, '被「' + n.name + '」阻塞，等待重试');
      });
    } else {
      r.status = 'done';
      r.output = outputFor(n, t);
      r.duration = 18 + Math.round(Math.random() * 40);
      logTask(t, n.name, '执行完成，输出 ' + (r.output.length * 3) + ' tokens');
    }
    updateProgress(t);
    t.updatedAt = nowIso();
    save(); render();
    setTimeout(() => tick(t), 260);
  }

  function outputFor(n, t) {
    if (OUTPUTS[n.name]) return OUTPUTS[n.name];
    if (n.type === 'summary') {
      const doneNames = t.snapshot.nodes.filter((x) => (t.runs[x.id] || {}).status === 'done' && x.id !== n.id).map((x) => x.name);
      return '综合 ' + (doneNames.join('、') || '上游节点') + ' 的结论，建议按「先验证、再扩展」推进：\n\n1. 首版只保留一个高频场景，8 周内完成验证；\n2. 技术侧优先交付调度与快照，工具权限收敛到白名单；\n3. 风险侧补齐数据脱敏、运行日志与人工审批。\n\n下一步：把结论固化到模板，创建新任务复用。';
    }
    return genericOutput(n);
  }

  function stopTask(taskId) {
    const t = findTask(taskId);
    if (!t) return;
    t.status = '已停止';
    Object.keys(t.runs || {}).forEach((k) => {
      if (t.runs[k].status === 'running') t.runs[k].status = 'pending';
    });
    logTask(t, '调度', '任务已由用户停止，已有输出保留');
    t.updatedAt = nowIso();
    save(); render();
    toast('任务已停止，已有输出已保留');
  }

  function retryFailed(taskId) {
    const t = findTask(taskId);
    if (!t) return;
    const failed = t.snapshot.nodes.filter((n) => (t.runs[n.id] || {}).status === 'failed');
    if (!failed.length) { toast('没有失败节点'); return; }
    failed.forEach((n) => {
      const r = t.runs[n.id];
      r.status = 'pending';
      r.error = '';
      logTask(t, n.name, '加入重试队列（尝试 ' + (r.attempts || 0) + ' 次）');
    });
    t.status = '运行中';
    t.updatedAt = nowIso();
    logTask(t, '调度', '重试失败节点：' + failed.map((n) => n.name).join('、') + '。已完成节点不会重复执行');
    save(); render();
    tick(t);

  function simulateFailure() {

    const running = t.snapshot.nodes.find((n) => n.type !== 'summary' && (t.runs[n.id] || {}).status === 'running');
    if (running) {
      state.failArmed = false;
      const r = t.runs[running.id];
      r.status = 'failed';
      r.error = '模拟失败：工具调用返回 503。已保留输入，可重试。';
      r.duration = (r.attempts || 1) * 12;
      logTask(t, running.name, '模拟失败：工具调用返回 503');
      t.status = '运行中';
      t.updatedAt = nowIso();
      save(); render();
      setTimeout(() => tick(t), 300);
      toast('已模拟「' + running.name + '」失败');
