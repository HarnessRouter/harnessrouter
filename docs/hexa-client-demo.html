  function createsCycle(nodes, nodeId, deps) {
    const byId = {};
    nodes.forEach((n) => { byId[n.id] = n; });
    const seen = {};
    function walk(id) {
      if (id === nodeId) return true;
      if (seen[id]) return false;
      seen[id] = true;
      const n = byId[id];
      if (!n) return false;
      return (n.deps || []).some(walk);
    }
    return deps.some(walk);
  }

  function publishTemplate() {
    const t = editingTemplate();
    if (!t) return;

    if (hasCycle(t.nodes)) { toast('存在循环依赖，无法发布'); return; }
    t.version = (t.version || 0) + 1;

    save(); render();
    toast('已发布 v' + t.version + '，已有任务仍使用创建时的快照');
  }

  function hasCycle(nodes) {
    const byId = {};
    nodes.forEach((n) => { byId[n.id] = n; });
    const stateMap = {};
    function visit(id) {
      if (stateMap[id] === 1) return true;
      if (stateMap[id] === 2) return false;
      stateMap[id] = 1;
      const n = byId[id];
      const res = n ? (n.deps || []).some(visit) : false;
      stateMap[id] = 2;
      return res;
    }
    return nodes.some((n) => visit(n.id));
  }

  document.addEventListener('change', function (e) {

    if (el.hasAttribute('data-model')) {
      switchConvAgentModel(el.dataset.model, el.value);
      return;
    }
    if (el.hasAttribute('data-summary')) {
      const conv = activeConv();
      conv.summaryAgent = el.value;
      save(); render();
      return;
    }
    if (el.matches('[data-dep]')) {
      const t = editingTemplate();
      const n = currentNode();
      if (!t || !n) return;
      const dep = el.dataset.dep;
      const deps = el.checked ? n.deps.concat([dep]) : n.deps.filter((d) => d !== dep);
      if (createsCycle(t.nodes, n.id, deps)) {
        toast('该依赖会形成循环，已还原');
        render();
        return;
      }
      n.deps = deps;
      markDraft(t);
      save(); render();
      return;
    }
    if (el.dataset.field) {
      const t = editingTemplate();
      const n = currentNode();
      if (!t || !n) return;
      const f = el.dataset.field;
      let v = el.value;
      if (f === 'timeout') v = clamp(Number(v) || 60, 30, 3600);
      if (f === 'retry') v = Number(v);
      if (!v && f !== 'retry') { toast('该字段不能为空'); render(); return; }

      markDraft(t);
      save(); render();

    drag = {
      id: n.id, el: el, sx: e.clientX, sy: e.clientY,
      ox: n.x, oy: n.y, nx: n.x, ny: n.y,
      zoom: state.templates.effZoom || 1
    };
    state.templates.nodeId = n.id;
    qa('#tpl-world .flow-node').forEach((x) => x.classList.toggle('selected', x.dataset.node === n.id));
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    const dx = (e.clientX - drag.sx) / drag.zoom;
    const dy = (e.clientY - drag.sy) / drag.zoom;
    drag.nx = clamp(drag.ox + dx, 0, 790);
    drag.ny = clamp(drag.oy + dy, 0, 440);
    drag.el.style.left = drag.nx + 'px';
    drag.el.style.top = drag.ny + 'px';
    drawEdges('tpl');
  });
  document.addEventListener('pointerup', function () {
    if (!drag) return;
    const t = editingTemplate();
    const n = t && t.nodes.find((x) => x.id === drag.id);
    if (n) {
      n.x = Math.round(drag.nx);
      n.y = Math.round(drag.ny);
      markDraft(t);
      save();
    }
    drag = null;
    render();

    if (state.module === 'tasks' && state.tasks.activeId) { fitRunCanvas(); drawEdges('run'); }
    if (state.module === 'templates' && state.templates.activeId) { applyZoom(); drawEdges('tpl'); }
    if (!isNarrow() && state.inspMobileOpen) { state.inspMobileOpen = false; renderInspector(); }
    const mob = isMobile();
    if (mob !== lastMobile) {
      lastMobile = mob;
      state.subOpen = !mob;
      if (mob) state.inspMobileOpen = false;
      q('#app').classList.toggle('sub-open', state.subOpen);
      renderInspector();
    }
  });

  /* ============================================================
     Boot
     ============================================================ */
  if (!findConv(state.chat.activeId)) {
    state.chat.activeId = data.conversations[0] ? data.conversations[0].id : null;
  }
  if (!data.workspaces.some((w) => w.id === state.workspaceId)) state.workspaceId = data.workspaces[0].id;
  render();
})();
</script>
