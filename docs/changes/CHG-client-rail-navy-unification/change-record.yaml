id: CHG-client-rail-navy-unification
status: closed
status_reason: 用户确认的统一深海军蓝配色已在 client 工作树实现，相关 Playwright 用例、类型检查、生产构建和截图证据均通过。
owner: Codex
source: 用户附图和“统一使用这种配色”的确认（2026-11-16）
goal: 将工作空间入口、工作空间头像和一级导航当前项统一为深海军蓝卡片配色，移除橙色头像与亮蓝半透明选中态的混用。
non_goals:
  - 修改工作空间切换、设置和创建流程
  - 调整右侧检查器宽度、标签或交互
  - 新增真实身份认证、密码校验或账户资料服务端接口
  - 恢复 HarnessRouter Cloud 能力
behavior:
  before: 默认工作空间使用橙色头像，其余头像使用品牌蓝；一级导航当前项使用亮蓝半透明底。
  after: 所有工作空间头像、工作空间入口和一级导航当前项统一使用深海军蓝卡片底与内描边，悬停仅在未选中态提亮。
acceptance:
  - id: AC-1
    entry: 左侧 rail 与工作空间切换浮层
    action: 打开工作空间浮层并检查入口和全部头像
    expected: 工作空间入口和默认/非默认头像背景均为 rgb(27, 43, 70)，描边为 rgb(53, 80, 117)。
    verification: client/tests/ui/workspace.spec.ts 中的工作空间配色断言
  - id: AC-2
    entry: 一级导航
    action: 检查当前“对话”入口
    expected: 当前项使用 rgb(27, 43, 70) 卡片底和内描边，不再使用亮蓝半透明底。
    verification: client/tests/ui/gateway-settings.spec.ts 中的导航配色断言
  - id: AC-3
    entry: 一级导航最下方用户头像
    action: 点击头像后登录、查看个人信息并退出
    expected: 头像位于主题按钮之后；浮层提供登录或个人信息与退出操作；静态版本信息仅保存在当前浏览器且不保存密码，刷新后保持已登录状态。
    verification: client/tests/ui/user-menu.spec.ts
  - id: AC-4
    entry: 应用后端模式
    action: 点击用户头像并退出登录
    expected: 复用同一头像入口，个人信息标注应用会话账户，退出调用应用会话登出接口并回到登录弹框。
    verification: client/tests/app-ui/navigation.spec.ts 中的共享用户菜单登出用例
baseline: 脏工作树；保留其他 client、Gateway、UHP/Runner 和 Hexa 产品契约改动。
