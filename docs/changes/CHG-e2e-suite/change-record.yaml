remaining:
  - 真实 Gateway / BYOK 模型链路未在本次 E2E 中执行；夹具只证明协议与持久化边界。
  - PostgreSQL 迁移与部署环境 E2E 未执行。
  - 全量 integration-ui 的 Edge `backend.spec.ts` 出现一次浏览器进程关闭（非断言失败）；该用例单独复跑通过，仍建议在更稳定的 Edge 环境重跑全量。
