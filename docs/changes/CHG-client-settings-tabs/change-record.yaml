id: CHG-client-settings-tabs
status: closed
status_reason: 设置弹框已改为左侧书签式标签与右侧内容面板，静态版和应用后端模式共用同一组件，相关测试、类型检查、生产构建和截图证据均通过。
owner: Codex
source: 用户要求“设置页面调整为左侧tab，右侧内容，类似书签效果”（2026-11-16）
goal: 将单页 Gateway 设置弹框重构为左侧垂直标签、右侧内容区，并把界面与导航设置纳入同一书签式弹框。
non_goals:
  - 修改 Gateway 请求、鉴权或配置存储契约
  - 新增设置分区或后端管理接口
  - 恢复 HarnessRouter Cloud 能力
behavior:
  before: 设置弹框标题为“Gateway 连接”，连接表单和导航文字开关在同一纵向长表单中，保存按钮为“保存连接”。
  after: 弹框标题为“设置”，左侧书签标签分为“连接”和“界面与导航”，右侧只显示当前分区；应用后端模式复用相同结构，底部按钮统一为“保存设置”。
acceptance:
  - id: AC-1
    entry: 一级导航设置按钮
    action: 打开设置并检查结构
    expected: 弹框名为“设置”，左栏为垂直 tablist，默认选中“连接”，标签右缘与右侧 panel 左缘衔接。
    verification: client/tests/ui/gateway-settings.spec.ts 中的书签布局用例
  - id: AC-2
    entry: 设置标签
    action: 点击“界面与导航”，再按 ArrowUp 返回“连接”
    expected: 内容随活动标签切换；活动标签为白色表面；方向键更新选中项和焦点。
    verification: 同上的 tab 状态、计算样式和键盘断言
  - id: AC-3
    entry: 界面与导航 tab
    action: 关闭“一级导航显示文字”并保存
    expected: 导航仅保留图标，刷新后保持设置；取消或 Escape 不保存草稿。
    verification: client/tests/ui/gateway-settings.spec.ts 的保存、取消和刷新断言
  - id: AC-4
    entry: 应用后端设置按钮
    action: 打开设置、切换界面与导航并保存
    expected: 应用后端模式使用同一书签结构，并持久化导航文字开关。
    verification: client/tests/app-ui/navigation.spec.ts（Chromium 与 Edge）
  - id: AC-5
    entry: 390px 移动视口
    action: 打开设置
    expected: 弹框不超出视口；“保存设置”在视口内；标签改为顶部横向布局。
    verification: 书签布局用例的移动视口断言和视觉截图
baseline: 脏工作树；保留其他 client、Gateway、UHP/Runner 和 Hexa 产品契约改动。
reuse_decision: extend
