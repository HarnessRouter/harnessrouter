id: CHG-task-workbench-redesign
status: verified_locally
status_reason: 三页统一 720px 全高详情、可拖拽宽度、列表/卡片视图和截图已完成本地实现与 Chromium/Edge 验证；未提交、未合入远端。
owner: Codex
source: 用户要求按当前任务作战台方案开始升级前端（2026-11-17）
goal: 将我的任务、运行记录、模板管理和对话页升级为用户确认的全高工作台布局，同时保留既有业务行为并移除四栏模式。
non_goals:
  - 新增或修改 Task / Run / Template / Conversation 后端接口
  - 恢复 Cloud 部署、hosted provider、目标工作区、余额或密钥入口
  - 新增 Team、权限、外部队列或任务执行语义
behavior:
  before: 任务详情使用抽屉，模板为卡片网格，运行记录以独立画布为主视图，对话检查器覆盖在主区右侧。
  after: 三个管理页统一使用 720px 全高、可拖拽并可分别记忆宽度的详情栏，支持列表/卡片视图；任务详情直接显示已采用结果与最近运行节点输出，并可在“我的任务”内打开流程图，无需跳转运行记录；对话页使用全高上下文栏，检查器不再覆盖主线程。
acceptance:
  - id: AC-1
    entry: 我的任务
    action: 查看、筛选、搜索和点选任务
    expected: 白底单一 table，无分组行，选中行与右侧详情同步
    verification: client/tests/app-ui/workbench-redesign.spec.ts、tasks.spec.ts
  - id: AC-2
    entry: 我的任务桌面视口
    action: 测量、拖拽、键盘调整并收起/展开详情栏
    expected: 详情栏全高，1440px 下展开 720px，窄桌面按 clamp(400px, 64%, 720px) 收缩且列表至少 280px；拖拽和键盘调整生效，收起 44px 后恢复本页宽度
    verification: client/tests/app-ui/workbench-redesign.spec.ts
  - id: AC-3
    entry: 运行记录
    action: 选择 Run、查看详情、打开流程图
    expected: 全高详情 1440px 下 720px、窄桌面按容器收缩，轨迹与事件双列，流程图次级入口可用
    verification: client/tests/app-ui/workbench-redesign.spec.ts、run-history.spec.ts
  - id: AC-4
    entry: 模板管理
    action: 选择模板并进入编辑器
    expected: 全高详情 1440px 下 720px、可拖拽且窄桌面按容器收缩，列表/卡片视图，编辑器可返回并保存
    verification: client/tests/app-ui/workbench-redesign.spec.ts、tasks.spec.ts
  - id: AC-5
    entry: 对话
    action: 查看会话和上下文，收起上下文
    expected: 主线程和上下文全高，上下文 304px，收起后 44px，composer 可见
    verification: client/tests/app-ui/workbench-redesign.spec.ts、navigation.spec.ts、chat.spec.ts
  - id: AC-6
    entry: 1440×900、1280×900、1024×900 与 390×844
    action: 打开四个页面并切换详情
    expected: 桌面无横向滚动，窄桌面三页详情与列表按容器宽度收缩且列表至少 280px、无内部溢出，移动端可访问抽屉且无页面横向溢出
    verification: client/tests/app-ui/workbench-redesign.spec.ts
  - id: AC-7
    entry: 既有任务、模板和对话操作
    action: 运行既有筛选、编辑器、发送与恢复用例
    expected: 原有业务行为仍可用
    verification: client/tests/app-ui/tasks.spec.ts、chat.spec.ts、run-history.spec.ts、navigation.spec.ts
  - id: AC-8
    entry: 我的任务 → 任务详情
    action: 查看任务结果，打开流程图并返回任务详情
    expected: 详情直接显示已采用结果与最近运行节点输出（只读快照、按节点去重）；“查看流程图”在“我的任务”内打开最近运行快照，返回后回到原详情，侧栏不切换到运行记录；草稿任务显示只读结构预览
    verification: client/tests/app-ui/tasks.spec.ts、client/tests/task-workbench.test.mjs
