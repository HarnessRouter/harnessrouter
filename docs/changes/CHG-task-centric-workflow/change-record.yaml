owner: Codex
source: 用户确认的任务模块正式产品方向（2026-11-16）
goal: 将我的任务、画布编排、并行执行、运行历史、节点调试和模板复用收敛为 hexa-api 驱动的任务系统。
version: v1
architecture:
  client: 展示任务状态、编辑画布并调用 hexa-api，不执行任务和保存权威运行状态。
  hexa_api: 负责任务领域模型、数据库、状态机、调度、权限、脱敏、REST/SSE。
  gateway: 只提供 hexa-api 调用的 Agent 执行能力，不保存 Hexa 任务历史。
non_goals:
  - 新增 Team 模型或成员权限
  - 修改 Gateway /v1/workflow-tasks 或 Gateway 任务模型
  - 跨设备离线编辑、外部队列、多实例租约和复杂条件分支
  - 恢复 HarnessRouter Cloud 部署、上传、目标工作区、余额、密钥握手或 hosted provider 入口
acceptance:
  - id: AC-1
    expected: 空白任务和模板任务都进入同一任务详情，模板运行历史不被复制。
    verification: hexa-api 任务创建集成测试、client 路由测试、E2E
  - id: AC-2
    expected: 画布保存生成不可变 WorkflowRevision，活动 Run 锁定执行语义配置。
    verification: 领域单元测试、API 集成测试、TaskCanvas 测试
  - id: AC-3
    expected: 五个无依赖 Agent 并行执行，状态通过 REST/SSE 到达 client。
    verification: fake Gateway 执行器集成测试、真实本地服务冒烟
  - id: AC-4
    expected: 只选择部分并行结果作为总结节点输入，deps 与 inputRefs 分离。
    verification: 输入引用单元测试、执行集成测试、E2E
  - id: AC-5
    expected: 总结、校验、报告按依赖执行，最终报告成功后任务完成。
    verification: 执行器集成测试、完整流程 E2E
  - id: AC-6
    expected: 人工门控进入 waiting_human，继续后恢复执行，决定可追溯。
    verification: 状态单元测试、API 集成测试、E2E
  - id: AC-7
    expected: 多次 Run 保存各自快照，NodeRun 输入输出和错误追加保留。
    verification: 持久化集成测试、调试 API 测试
  - id: AC-8
    expected: 重试、跳过、取消和终态重跑遵循状态契约，终态重跑创建新 Run。
    verification: 状态和执行器集成测试
  - id: AC-9
    expected: 采用新结果后实际消费者显示过期，历史记录不改写。
    verification: stale 派生单元测试、采用结果集成测试、UI 测试
  - id: AC-10
    expected: 调试视图显示脱敏输入、环境、输出、错误、耗时和重试历史。
    verification: 脱敏单元测试、API 安全测试、UI E2E
  - id: AC-11
