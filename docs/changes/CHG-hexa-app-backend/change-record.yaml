    entry: GET /healthz
    action: 启动 FastAPI 应用并探测健康接口
    expected: 返回可探测的健康状态
    verification: hexa-api/tests/test_health.py
  - id: AC-2
    entry: POST /api/hexa/auth/login
    action: 使用正确和错误管理员凭据登录
    expected: 正确凭据设置 HttpOnly Cookie，错误凭据返回 401
    verification: hexa-api/tests/test_auth.py
  - id: AC-3
    entry: 受保护 API
    action: 无 Cookie、伪造 Cookie 和有效 Cookie 分别访问
    expected: 未认证为 401，有效会话可访问
    verification: hexa-api/tests/test_auth.py
  - id: AC-4
    entry: auth_sessions 数据
    action: 登录后读取测试数据库记录
    expected: 只保存 Token 哈希，不保存原始 Token
    verification: hexa-api/tests/test_auth.py
  - id: AC-5
    entry: GET /api/hexa/agents
    action: 通过 fake Gateway 读取 Agent 列表
    expected: Gateway Key 不出现在响应、异常或日志中
    verification: hexa-api/tests/test_gateway_agents.py
  - id: AC-7
    entry: app 模式 Agent 页面与对话 Agent/模型选择
    action: 创建、失败重试、删除确认、列表重读、切换 Agent 和模型加载
    expected: 只展示 Gateway 返回的真实列表；失败保留原状态；过期模型响应不能覆盖当前 Agent；模型不可用时禁止发送
    verification: client/tests/app-api.test.mjs; client/tests/app-ui/agents.spec.ts; client/tests/integration-ui/backend.spec.ts
  - id: AC-8
    entry: app 模式工作空间入口与设置
    action: 打开工作空间浮层、工作区设置、新建工作区，并打开应用设置的两个书签标签
    expected: 380px 白色浮层展示工作空间与当前勾选；两个 480px 表单居中，更新走 PATCH，创建后自动选择；设置使用左栏书签标签，连接页说明 Gateway 由应用后端管理；390px 无横向溢出
    verification: client/tests/app-ui/workspace-settings.spec.ts; client/tests/app-api.test.mjs; hexa-api/tests/test_workspaces.py
