owner: Codex
source: 用户需求（2026-11-13）：“hexa版本就是要移除cloud相关功能”。
goal: 移除 Hexa 面向 HarnessRouter Cloud 的部署、上传、账号/余额和 hosted provider 产品入口，同时保留普通 provider、UHP、Runner 与浏览器能力。
non_goals:
  - 删除普通外部模型服务商连接
  - 删除 UHP、Runner 或浏览器运行时
  - 清理所有仅作历史参考的 hosted/cloud 字样
behavior:
  before: Hexa 暴露 Cloud upload、目标管理、部署连接握手以及 HarnessRouter hosted provider 的 key/模型/余额逻辑。
  after: 这些产品能力和路由不存在；普通本地编排与用户自有服务商连接继续工作。
acceptance:
  - id: AC-1
    entry: Gateway route registry and public OpenAPI
    action: Inspect routes and request removed Cloud paths.
    expected: Cloud paths are absent or return 404/405 without outbound Cloud calls; OpenAPI does not list them.
    verification: gateway/tests/test_hexa_no_cloud.py and gateway/tests/test_harness_env.py
  - id: AC-2
    entry: Console setup, workspace and BYOK pages
    action: Render affected pages and run focused UI tests.
    expected: No Cloud deployment/upload or HarnessRouter hosted account action is rendered or called.
    verification: Focused Jest and TypeScript checks
  - id: AC-3
    entry: Documentation
    action: Search product docs for Cloud deployment/account promotion.
    expected: Hexa docs describe local/self-hosted operation only.
    verification: rg and diff review
