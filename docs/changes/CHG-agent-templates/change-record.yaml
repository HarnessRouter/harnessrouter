    next: 部署时先执行 migrations/003_agent_templates.sql，再在已配置 Gateway 验证模板读取；不宣称生产可发布。
remaining: [生产迁移与部署环境实测, 并行任务页面导航旧断言由对应工作修正]
rollback: 新表独立，不修改既有任务模板和 Gateway 数据；撤销本次入口和新增 router 即停止使用。
document_exit: 保留 spec/plan/visual-contract 与最终验证摘要为本领域契约。
