security_review:
  result: passed_self_review
  evidence:
    - 所有新增路由强制 session，并按 user_id 查询/更新/删除；跨站写入复用应用 middleware。
    - Gateway 只访问服务端已配置地址下的固定 /v1/bases；映射白名单字段，凭据/环境/插件不进入模板。
    - 数据库使用 SQLAlchemy 参数化查询；名称/base/model 去空白并限制长度，说明/提示词限制体积。
    - 客户文本由 React 普通文本呈现，无 HTML/命令执行；未添加新依赖。
    - 面板 key 绑定 username，认证清除时销毁模板缓存、编辑器与过期请求；E2E 证明模板隐藏。
visual_review:
  functional: passed
  visual: passed，桌面卡片/列表、深色、390px 手机列表与长文本均已检查；几何断言证明列表单列排列。
  advisory: build chunk size >500 kB
  screenshots: 详见 visual-report.md，截图位于工作区外系统临时目录。
