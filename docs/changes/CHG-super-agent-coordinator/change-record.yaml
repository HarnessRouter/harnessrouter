id: CHG-super-agent-coordinator
status: completed
status_reason: 用户确认协调 Agent 只分发、监控和汇报，不执行具体工作；本次实现从现有任务 REST/SSE 契约扩展 client 入口，并已完成客户端验证。
owner: Codex
source: 用户需求（2026-11-19）
goal: 在 client 增加协调 Agent，支持多任务分发、实时监控、状态管理和结果汇报。
non_goals:
  - 新增后端 Super Agent 或 Gateway 执行节点
  - 修改 Task/WorkflowRevision/Run 保存语义
  - 恢复 Hexa Cloud、余额、密钥或 hosted provider 入口
behavior:
  before: client 只能在任务工作台内查看和监控已加载的活动 Run。
  after: client 提供协调 Agent 页面，批量启动已保存任务并同时订阅多个 Run，断线后逐项轮询恢复并汇报结果。
acceptance:
  - id: AC-1
    entry: 协调 Agent
    action: 选择多个已保存任务并点击分发
    expected: 每个任务独立创建 Run；单个失败不影响其他成功启动项，页面显示逐项结果。
    verification: client/tests/super-agent-coordinator.test.mjs；协调页 Playwright 用例
  - id: AC-2
    entry: 协调 Agent
    action: 观察多个活动 Run
    expected: 每个 Run 独立显示服务端状态、节点进度和最新事件，支持完成、等待人工、失败和取消。
    verification: 协调页 Playwright 用例；复用 appWatchTaskRun API
  - id: AC-3
    entry: 协调 Agent
    action: 断开一个 Run 的 SSE
    expected: 该 Run 进入恢复提示并轮询，其他 Run 继续更新，终态后停止轮询。
    verification: 协调页 Playwright 用例
  - id: AC-4
    entry: 协调 Agent
    action: 打开创建任务或模板入口
    expected: 进入既有任务工作台，不把草稿作为已保存可运行版本。
    verification: 导航回归和任务工作台回归
